
name: Build and Deploy TokenScope DEV Image

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: tokenscope-dev-image
  cancel-in-progress: false

jobs:
  build-push-deploy:
    name: Build, Push and Deploy DEV

    # Enterprise runner — private Azure networking required
    runs-on: ubuntu-latest-azureuswest3-4core

    environment: dev
    timeout-minutes: 60

    env:
      AZURE_RESOURCE_GROUP: rg-westeurope-t1-amd-dev-helios-001
      EXPECTED_SUBSCRIPTION: a4924ab9-f91e-4235-a611-8b1c3cfb9a7f
      ACR_NAME: crtokenscopeigdcdevweu
      IMAGE_NAME: tokenscope
      CONTAINER_APP_NAME: ca-tokenscopeigdc-dev-weu

    steps:

      # STEP 1 — Checkout
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # STEP 2 — Azure OIDC authentication
      - name: Azure Login using OIDC
        uses: azure/login@0949e32778441b2c442592b7a0e6313466dc8f29
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # STEP 3 — Verify Azure deployment target
      - name: Verify DEV subscription and resources
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Azure Subscription ==="
          az account show \
            --query "{Name:name,Subscription:id,Tenant:tenantId}" \
            -o table

          ACTUAL_SUB=$(az account show --query id -o tsv)

          if [ "$ACTUAL_SUB" != "$EXPECTED_SUBSCRIPTION" ]; then
            echo "::error::Wrong Azure subscription"
            exit 1
          fi

          test "$AZURE_RESOURCE_GROUP" = \
            "rg-westeurope-t1-amd-dev-helios-001"

          test "$ACR_NAME" = "crtokenscopeigdcdevweu"

          test "$CONTAINER_APP_NAME" = \
            "ca-tokenscopeigdc-dev-weu"

          az group show \
            --name "$AZURE_RESOURCE_GROUP" \
            --output none

          az acr show \
            --name "$ACR_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output none

          az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output none

          echo "DEV deployment target verified"

      # STEP 4 — Verify private ACR configuration
      - name: Check DEV ACR network configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=== ACR Configuration ==="
          az acr show \
            --name "$ACR_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query '{
              Name:name,
              PublicAccess:publicNetworkAccess,
              RoleMode:roleAssignmentMode,
              ProvisioningState:provisioningState
            }' \
            -o json

          PUBLIC_ACCESS=$(az acr show \
            --name "$ACR_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query publicNetworkAccess \
            -o tsv)

          if [ "$PUBLIC_ACCESS" != "Disabled" ]; then
            echo "::warning::ACR public network access is not Disabled"
          fi

      # STEP 5 — Check private endpoint connectivity
      - name: Verify private ACR DNS and HTTPS connectivity
        shell: bash
        run: |
          set -euo pipefail

          REGISTRY="${ACR_NAME}.azurecr.io"

          echo "=== DNS Resolution ==="
          getent ahostsv4 "$REGISTRY"

          echo "=== HTTPS Connectivity ==="
          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --max-time 20 \
            "https://${REGISTRY}/v2/")

          echo "ACR HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" = "403" ]; then
            echo "::error::ACR denied HTTPS access (403)"
            echo "::error::Check private DNS, routing, and registry network policy"
            exit 1
          fi

          if [ "$HTTP_CODE" != "401" ] && \
             [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Unexpected registry response: $HTTP_CODE"
            exit 1
          fi

          echo "Registry HTTPS endpoint reachable"

      # STEP 6 — Azure ACR Login
      - name: Login to DEV ACR
        shell: bash
        run: |
          set -euo pipefail

          echo "Logging in to $ACR_NAME"

          az acr login --name "$ACR_NAME"

          echo "ACR login successful"

      # STEP 7 — Verify Docker availability
      - name: Verify Docker
        shell: bash
        run: |
          docker version
          docker info --format '{{.ServerVersion}}'

      # STEP 8 — Build Docker image
      - name: Build TokenScope Docker image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}"

          docker build \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            .

          echo "Docker build successful"

      # STEP 9 — Push commit-tagged image
      - name: Push Docker image to DEV ACR
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}"

          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

          echo "Docker images pushed successfully"

      # STEP 10 — Verify image exists
      - name: Verify pushed image
        shell: bash
        run: |
          set -euo pipefail

          az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$IMAGE_NAME" \
            --output table

          az acr repository show \
            --name "$ACR_NAME" \
            --image "${IMAGE_NAME}:${GITHUB_SHA}" \
            --output none

          echo "Image exists in DEV ACR"

      # STEP 11 — Deploy image to Container App
      - name: Update DEV Container App
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA}"

          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE" \
            --output none

          echo "Container App update completed"

      # STEP 12 — Verify Container App
      - name: Verify DEV Container App
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Container App Image ==="
          az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.template.containers[].image" \
            -o tsv

          echo "=== Container App Revisions ==="
          az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query '[].{
              Name:name,
              Active:properties.active,
              RunningState:properties.runningState,
              HealthState:properties.healthState
            }' \
            -o table

      # STEP 13 — Azure Logout
      - name: Azure Logout
        if: always()
        shell: bash
        run: |
          az logout || true
