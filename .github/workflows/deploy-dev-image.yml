
name: Build and Deploy TokenScope DEV Image

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-push-deploy:
    name: Build, Push and Deploy DEV
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 45

    env:
      AZURE_RESOURCE_GROUP: rg-westeurope-t1-amd-dev-helios-001
      EXPECTED_SUBSCRIPTION: a4924ab9-f91e-4235-a611-8b1c3cfb9a7f
      ACR_NAME: crtokenscopeigdcdevweu
      IMAGE_NAME: tokenscope
      CONTAINER_APP_NAME: ca-tokenscopeigdc-dev-weu

    steps:
      # STEP 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # STEP 2: Azure Login using OIDC
      - name: Azure Login using OIDC
        uses: azure/login@0949e32778441b2c442592b7a0e6313466dc8f29
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # STEP 3: Verify DEV target resources
      - name: Verify DEV target and resources
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_SUB=$(az account show --query id -o tsv)

          test "$ACTUAL_SUB" = "$EXPECTED_SUBSCRIPTION" || {
            echo "Wrong Azure subscription"
            exit 1
          }

          test "$AZURE_RESOURCE_GROUP" = "rg-westeurope-t1-amd-dev-helios-001"
          test "$ACR_NAME" = "crtokenscopeigdcdevweu"
          test "$CONTAINER_APP_NAME" = "ca-tokenscopeigdc-dev-weu"

          az group show \
            --name "$AZURE_RESOURCE_GROUP" \
            --output none

          az acr show \
            --name "$ACR_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output none

          az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output none

          echo "Validated DEV resources and subscription."

      # STEP 4: Login to DEV ACR
      - name: Login to DEV ACR
        shell: bash
        run: |
          az acr login \
            --name "$ACR_NAME"

      # STEP 5: Build Docker image
      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}"

          docker build \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            .

      # STEP 6: Push Docker image
      - name: Push Docker image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}"

          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      # STEP 7: Verify latest image exists
      - name: Verify pushed image
        shell: bash
        run: |
          set -euo pipefail

          az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$IMAGE_NAME" \
            --output table

          az acr repository show \
            --name "$ACR_NAME" \
            --image "${IMAGE_NAME}:${GITHUB_SHA}" \
            --output none

      # STEP 8: Update DEV Container App
      - name: Update DEV Container App
        shell: bash
        run: |
          set -euo pipefail

          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA}" \
            --output none

      # STEP 9: Verify Container App revisions
      - name: Verify DEV Container App revisions
        shell: bash
        run: |
          az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output table

      # STEP 10: Logout
      - name: Azure Logout
        if: always()
        shell: bash
        run: |
          az logout || true
