name: Build Known-Good DEV Commit for TokenScope DEMO

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-push-deploy:
    name: Build and Deploy Known-Good Commit to DEMO
    runs-on: ubuntu-latest
    environment: demo
    timeout-minutes: 45

    env:
      AZURE_RESOURCE_GROUP: rg-westeurope-t1-amd-demo-helios-001
      EXPECTED_SUBSCRIPTION: a4924ab9-f91e-4235-a611-8b1c3cfb9a7f
      ACR_NAME: crtokenscopeigdcdemodevweu
      IMAGE_NAME: tokenscope
      CONTAINER_APP_NAME: ca-tokenscopeigdcdemo-dev-weu

      # Exact application commit currently working in DEV
      IMAGE_TAG: 308dde71df94ef0d049ac260b7067b277e28185a

    steps:

      # STEP 1: Checkout exact known-good DEV commit
      - name: Checkout known-good DEV commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 308dde71df94ef0d049ac260b7067b277e28185a

      # STEP 2: Azure Login using DEMO OIDC identity
      - name: Azure Login using OIDC
        uses: azure/login@0949e32778441b2c442592b7a0e6313466dc8f29
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # STEP 3: Validate DEMO target
      - name: Verify DEMO target and resources
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_SUB=$(az account show --query id -o tsv)

          if [ "$ACTUAL_SUB" != "$EXPECTED_SUBSCRIPTION" ]; then
            echo "ERROR: Wrong Azure subscription"
            echo "Expected: $EXPECTED_SUBSCRIPTION"
            echo "Actual:   $ACTUAL_SUB"
            exit 1
          fi

          test "$AZURE_RESOURCE_GROUP" = "rg-westeurope-t1-amd-demo-helios-001"
          test "$ACR_NAME" = "crtokenscopeigdcdemodevweu"
          test "$CONTAINER_APP_NAME" = "ca-tokenscopeigdcdemo-dev-weu"

          az group show \
            --name "$AZURE_RESOURCE_GROUP" \
            --output none

          az acr show \
            --name "$ACR_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output none

          az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output none

          echo "SUCCESS: DEMO target validated"

      # STEP 4: Login to DEMO ACR
      - name: Login to DEMO ACR
        shell: bash
        run: |
          set -euo pipefail

          az acr login \
            --name "$ACR_NAME"

      # STEP 5: Build exact known-good application image
      - name: Build known-good Docker image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}"

          docker build \
            -t "${IMAGE}:${IMAGE_TAG}" \
            .

      # STEP 6: Push known-good image to DEMO ACR
      - name: Push known-good Docker image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}"

          docker push "${IMAGE}:${IMAGE_TAG}"

      # STEP 7: Verify image exists
      - name: Verify known-good image
        shell: bash
        run: |
          set -euo pipefail

          az acr repository show \
            --name "$ACR_NAME" \
            --image "${IMAGE_NAME}:${IMAGE_TAG}" \
            --output none

          echo "SUCCESS: Known-good image exists in DEMO ACR"

      # STEP 8: Deploy known-good image to DEMO
      - name: Update DEMO Container App
        shell: bash
        run: |
          set -euo pipefail

          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}" \
            --output none

          echo "SUCCESS: Known-good DEV commit deployed to DEMO"

      # STEP 9: Verify exact image
      - name: Verify deployed DEMO image
        shell: bash
        run: |
          set -euo pipefail

          DEPLOYED_IMAGE=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" \
            --output tsv)

          echo "Deployed image: $DEPLOYED_IMAGE"

          EXPECTED_IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"

          if [ "$DEPLOYED_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "ERROR: DEMO is not running the expected image"
            exit 1
          fi

          echo "SUCCESS: DEMO is running the known-good DEV commit"

      # STEP 10: Verify revisions
      - name: Verify DEMO Container App revisions
        shell: bash
        run: |
          az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output table

      # STEP 11: Logout
      - name: Azure Logout
        if: always()
        shell: bash
        run: |
          az logout || true
