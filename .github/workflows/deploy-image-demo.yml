name: Build Push and Deploy TokenScope DEMO

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy pushed image to existing DEMO Container App'
        type: boolean
        required: true
        default: false
      backup_verified:
        description: 'I verified a restorable DEMO PostgreSQL backup'
        type: boolean
        required: true
        default: false
      migrations_reviewed:
        description: 'I reviewed DEMO schema compatibility and image startup scripts'
        type: boolean
        required: true
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: tokenscope-demo-image
  cancel-in-progress: false

jobs:
  build-push-deploy:
    name: Build Push and Optionally Deploy DEMO
    runs-on:
      - self-hosted
      - Linux
      - X64
      - tokenscope-demo
    environment: demo
    timeout-minutes: 60
    env:
      AZURE_RESOURCE_GROUP: rg-westeurope-t1-amd-demo-helios-001
      EXPECTED_SUBSCRIPTION: a4924ab9-f91e-4235-a611-8b1c3cfb9a7f
      ACR_NAME: crtokenscopeigdcdemodevweu
      IMAGE_NAME: tokenscope
      CONTAINER_APP_NAME: ca-tokenscopeigdcdemo-dev-weu
      IMAGE_TAG: 308dde71df94ef0d049ac260b7067b277e28185a

    steps:
      - name: Check out selected application commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 308dde71df94ef0d049ac260b7067b277e28185a

      - name: Validate selected commit and deployment approvals
        shell: bash
        env:
          DO_DEPLOY: ${{ inputs.deploy }}
          BACKUP_VERIFIED: ${{ inputs.backup_verified }}
          MIGRATIONS_REVIEWED: ${{ inputs.migrations_reviewed }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IMAGE_TAG"
          if [[ "$DO_DEPLOY" == "true" ]]; then
            if [[ "$BACKUP_VERIFIED" != "true" || "$MIGRATIONS_REVIEWED" != "true" ]]; then
              echo 'ERROR: Deployment requires verified backup and reviewed migrations/startup scripts.'
              exit 1
            fi
          fi

      - name: Azure login using DEMO OIDC
        uses: azure/login@0949e32778441b2c442592b7a0e6313466dc8f29
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify existing DEMO targets and private ACR access
        shell: bash
        run: |
          set -euo pipefail
          test "$(az account show --query id -o tsv)" = "$EXPECTED_SUBSCRIPTION"
          test "$AZURE_RESOURCE_GROUP" = 'rg-westeurope-t1-amd-demo-helios-001'
          test "$ACR_NAME" = 'crtokenscopeigdcdemodevweu'
          test "$CONTAINER_APP_NAME" = 'ca-tokenscopeigdcdemo-dev-weu'
          echo "Runner: $RUNNER_NAME; Hostname: $(hostname)"
          az acr show --name "$ACR_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --output none
          az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --output none
          getent ahostsv4 "${ACR_NAME}.azurecr.io"
          docker info >/dev/null
          az acr login --name "$ACR_NAME"

      - name: Build exact commit image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"
          docker build -t "$IMAGE" .

      - name: Push image to existing DEMO ACR
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "$IMAGE"
          az acr repository show --name "$ACR_NAME" --image "${IMAGE_NAME}:${IMAGE_TAG}" --output none
          echo "Image pushed: $IMAGE"

      - name: Update existing DEMO Container App
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE" \
            --output none

      - name: Verify deployed DEMO image and revisions
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"
          ACTUAL=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query 'properties.template.containers[0].image' -o tsv)
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "ERROR: Expected $EXPECTED, got $ACTUAL"
            exit 1
          fi
          az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output table
          echo 'Image reference verified; verify revision health and application data separately.'

      - name: Azure logout
        if: always()
        shell: bash
        run: az logout || true
