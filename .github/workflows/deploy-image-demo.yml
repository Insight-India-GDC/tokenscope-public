name: Build Push and Deploy TokenScope DEMO

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: tokenscope-demo-image-deployment
  cancel-in-progress: false

jobs:
  build-push-deploy:
    name: Build Push and Deploy DEMO
    runs-on:
      - self-hosted
      - Linux
      - X64
      - tokenscope-demo
    environment: demo
    timeout-minutes: 60

    env:
      AZURE_RESOURCE_GROUP: rg-westeurope-t1-amd-demo-helios-001
      EXPECTED_SUBSCRIPTION: a4924ab9-f91e-4235-a611-8b1c3cfb9a7f
      ACR_NAME: crtokenscopeigdcdemodevweu
      IMAGE_NAME: tokenscope
      CONTAINER_APP_NAME: ca-tokenscopeigdcdemo-dev-weu
      IMAGE_TAG: 308dde71df94ef0d049ac260b7067b277e28185a

    steps:
      - name: Checkout selected application commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 308dde71df94ef0d049ac260b7067b277e28185a

      - name: Verify application commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IMAGE_TAG"
          echo "SUCCESS: Application commit verified."

      - name: Azure Login using DEMO OIDC
        uses: azure/login@0949e32778441b2c442592b7a0e6313466dc8f29
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify existing DEMO resources and private runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(az account show --query id -o tsv)" = "$EXPECTED_SUBSCRIPTION"
          test "$AZURE_RESOURCE_GROUP" = "rg-westeurope-t1-amd-demo-helios-001"
          test "$ACR_NAME" = "crtokenscopeigdcdemodevweu"
          test "$CONTAINER_APP_NAME" = "ca-tokenscopeigdcdemo-dev-weu"

          echo "Runner: $RUNNER_NAME"
          echo "Hostname: $(hostname)"

          az group show --name "$AZURE_RESOURCE_GROUP" --output none
          az acr show --name "$ACR_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --output none
          az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --output none

          echo "Private ACR DNS:"
          getent hosts "${ACR_NAME}.azurecr.io"
          echo "SUCCESS: Existing DEMO resources and DNS verified."

      - name: Verify Docker
        shell: bash
        run: |
          set -euo pipefail
          docker --version
          docker info >/dev/null

      - name: Login to private DEMO ACR
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          echo "SUCCESS: Logged into private DEMO ACR."

      - name: Build DEMO Docker image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"
          docker build --tag "$IMAGE" .
          echo "SUCCESS: Docker image built: $IMAGE"

      - name: Push image to DEMO ACR
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "$IMAGE"
          echo "SUCCESS: Docker image pushed: $IMAGE"

      - name: Verify pushed image in DEMO ACR
        shell: bash
        run: |
          set -euo pipefail
          az acr repository show \
            --name "$ACR_NAME" \
            --image "${IMAGE_NAME}:${IMAGE_TAG}" \
            --output none
          echo "SUCCESS: Image present in existing DEMO ACR."

      - name: Update existing DEMO Container App
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE" \
            --output none
          echo "SUCCESS: DEMO Container App image updated."

      - name: Verify deployed DEMO image and revisions
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"
          DEPLOYED_IMAGE=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query 'properties.template.containers[0].image' \
            --output tsv)

          echo "Expected image: $EXPECTED_IMAGE"
          echo "Configured image: $DEPLOYED_IMAGE"
          test "$DEPLOYED_IMAGE" = "$EXPECTED_IMAGE"

          az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output table
          echo "SUCCESS: DEMO image reference verified."

      - name: Azure Logout
        if: always()
        shell: bash
        run: az logout || true
