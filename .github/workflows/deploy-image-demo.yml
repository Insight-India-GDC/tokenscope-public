name: Build Push and Deploy TokenScope DEMO

on:
  workflow_dispatch:
    inputs:
      backup_verified:
        description: 'I verified a restorable DEMO PostgreSQL backup'
        type: boolean
        required: true
        default: false
      migrations_reviewed:
        description: 'I reviewed the pinned commit startup scripts and DEMO DB compatibility'
        type: boolean
        required: true
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: tokenscope-demo-image-deploy
  cancel-in-progress: false

jobs:
  build-push-deploy:
    name: Build, Push, Deploy and Verify DEMO
    # Replace tokenscope-demo with the label that succeeded in your DEMO ACR login run.
    runs-on:
      - self-hosted
      - Linux
      - X64
      - tokenscope-demo
    environment: demo
    timeout-minutes: 60

    env:
      AZURE_RESOURCE_GROUP: rg-westeurope-t1-amd-demo-helios-001
      EXPECTED_SUBSCRIPTION: a4924ab9-f91e-4235-a611-8b1c3cfb9a7f
      ACR_NAME: crtokenscopeigdcdemodevweu
      IMAGE_NAME: tokenscope
      CONTAINER_APP_NAME: ca-tokenscopeigdcdemo-dev-weu
      IMAGE_TAG: 308dde71df94ef0d049ac260b7067b277e28185a

    steps:
      - name: Checkout approved application commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 308dde71df94ef0d049ac260b7067b277e28185a

      - name: Require backup and migration approvals before any deployment
        shell: bash
        env:
          BACKUP_VERIFIED: ${{ inputs.backup_verified }}
          MIGRATIONS_REVIEWED: ${{ inputs.migrations_reviewed }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IMAGE_TAG"
          if [[ "$BACKUP_VERIFIED" != 'true' || "$MIGRATIONS_REVIEWED" != 'true' ]]; then
            echo 'ERROR: Confirm a restorable DEMO backup and review database migrations/startup scripts before deploying.'
            exit 1
          fi
          echo 'Operator has confirmed both prerequisites.'

      - name: Azure login using DEMO OIDC
        uses: azure/login@0949e32778441b2c442592b7a0e6313466dc8f29
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify existing DEMO resources and private runner
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner name: $RUNNER_NAME"
          echo "Hostname: $(hostname)"
          test "$(az account show --query id -o tsv)" = "$EXPECTED_SUBSCRIPTION"
          test "$AZURE_RESOURCE_GROUP" = 'rg-westeurope-t1-amd-demo-helios-001'
          test "$ACR_NAME" = 'crtokenscopeigdcdemodevweu'
          test "$CONTAINER_APP_NAME" = 'ca-tokenscopeigdcdemo-dev-weu'
          az group show -n "$AZURE_RESOURCE_GROUP" -o none
          az acr show -n "$ACR_NAME" -g "$AZURE_RESOURCE_GROUP" -o none
          az containerapp show -n "$CONTAINER_APP_NAME" -g "$AZURE_RESOURCE_GROUP" -o none
          getent hosts "${ACR_NAME}.azurecr.io"
          docker --version
          docker info > /dev/null

      - name: Login to private DEMO ACR
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          echo 'SUCCESS: Private DEMO ACR login.'

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"
          docker build --tag "$IMAGE" .
          echo "SUCCESS: Built $IMAGE"

      - name: Push Docker image to DEMO ACR
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "$IMAGE"
          echo "SUCCESS: Pushed $IMAGE"

      - name: Verify image in DEMO ACR
        shell: bash
        run: |
          set -euo pipefail
          az acr repository show \
            --name "$ACR_NAME" \
            --image "${IMAGE_NAME}:${IMAGE_TAG}" \
            --output none
          echo 'SUCCESS: Image exists in DEMO ACR.'

      - name: Update existing DEMO Container App
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE" \
            --output none
          echo "SUCCESS: Updated existing DEMO Container App image to $IMAGE"

      - name: Verify deployed DEMO image and revisions
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"
          DEPLOYED_IMAGE=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query 'properties.template.containers[0].image' \
            --output tsv)
          echo "Expected: $EXPECTED_IMAGE"
          echo "Deployed: $DEPLOYED_IMAGE"
          if [[ "$DEPLOYED_IMAGE" != "$EXPECTED_IMAGE" ]]; then
            echo 'ERROR: DEMO Container App image reference does not match.'
            exit 1
          fi
          az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output table
          echo 'SUCCESS: Deployed image reference verified. Check application health and PostgreSQL data separately.'

      - name: Azure Logout
        if: always()
        shell: bash
        run: az logout || true
