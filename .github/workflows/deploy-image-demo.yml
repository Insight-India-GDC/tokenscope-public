name: Build and Deploy TokenScope DEMO Image

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-push-deploy:
    name: Build, Push and Deploy DEMO
    runs-on: ubuntu-latest
    environment: demo
    timeout-minutes: 45

    env:
      AZURE_RESOURCE_GROUP: rg-westeurope-t1-amd-demo-helios-001
      EXPECTED_SUBSCRIPTION: a4924ab9-f91e-4235-a611-8b1c3cfb9a7f
      ACR_NAME: crtokenscopeigdcdemodevweu
      IMAGE_NAME: tokenscope
      CONTAINER_APP_NAME: ca-tokenscopeigdcdemo-dev-weu

    steps:
      # STEP 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # STEP 2: Login to Azure using GitHub OIDC
      - name: Azure Login using OIDC
        uses: azure/login@0949e32778441b2c442592b7a0e6313466dc8f29
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # STEP 3: Validate DEMO target resources
      - name: Verify DEMO target and resources
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_SUB=$(az account show --query id -o tsv)

          if [ "$ACTUAL_SUB" != "$EXPECTED_SUBSCRIPTION" ]; then
            echo "ERROR: Wrong Azure subscription."
            echo "Expected: $EXPECTED_SUBSCRIPTION"
            echo "Actual:   $ACTUAL_SUB"
            exit 1
          fi

          if [ "$AZURE_RESOURCE_GROUP" != "rg-westeurope-t1-amd-demo-helios-001" ]; then
            echo "ERROR: Wrong resource group."
            exit 1
          fi

          if [ "$ACR_NAME" != "crtokenscopeigdcdemodevweu" ]; then
            echo "ERROR: Wrong ACR."
            exit 1
          fi

          if [ "$CONTAINER_APP_NAME" != "ca-tokenscopeigdcdemo-dev-weu" ]; then
            echo "ERROR: Wrong Container App."
            exit 1
          fi

          az group show \
            --name "$AZURE_RESOURCE_GROUP" \
            --output none

          az acr show \
            --name "$ACR_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output none

          az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output none

          echo "SUCCESS: Validated DEMO resources and subscription."

      # STEP 4: Login to DEMO ACR
      - name: Login to DEMO ACR
        shell: bash
        run: |
          set -euo pipefail

          az acr login \
            --name "$ACR_NAME"

      # STEP 5: Build Docker image
      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}"

          docker build \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            .

      # STEP 6: Push Docker image
      - name: Push Docker image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}"

          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      # STEP 7: Verify pushed image
      - name: Verify pushed image
        shell: bash
        run: |
          set -euo pipefail

          az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$IMAGE_NAME" \
            --output table

          az acr repository show \
            --name "$ACR_NAME" \
            --image "${IMAGE_NAME}:${GITHUB_SHA}" \
            --output none

          az acr repository show \
            --name "$ACR_NAME" \
            --image "${IMAGE_NAME}:latest" \
            --output none

          echo "SUCCESS: DEMO images verified."

      # STEP 8: Update DEMO Container App
      - name: Update DEMO Container App
        shell: bash
        run: |
          set -euo pipefail

          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA}" \
            --output none

          echo "SUCCESS: DEMO Container App updated."

      # STEP 9: Verify Container App revisions
      - name: Verify DEMO Container App revisions
        shell: bash
        run: |
          set -euo pipefail

          az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output table

      # STEP 10: Logout
      - name: Azure Logout
        if: always()
        shell: bash
        run: |
          az logout || true
