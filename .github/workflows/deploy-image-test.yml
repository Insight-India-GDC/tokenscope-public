name: Build Known-Good DEV Commit for TokenScope TEST

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-push-deploy:
    name: Build and Deploy Known-Good Commit to TEST

    # TEST uses the private self-hosted runner because
    # TEST ACR will be private.
    runs-on:
      - self-hosted
      - Linux
      - X64
      - tokenscope-test

    # IMPORTANT:
    # Uses GitHub:
    # Settings → Environments → test
    #
    # Required reviewers configured on TEST apply here.
    environment: test

    timeout-minutes: 45

    env:
      AZURE_RESOURCE_GROUP: rg-westeurope-t1-amd-test-helios-001

      EXPECTED_SUBSCRIPTION: a4924ab9-f91e-4235-a611-8b1c3cfb9a7f

      ACR_NAME: crtokenscopeigdctestdevweu

      IMAGE_NAME: tokenscope

      CONTAINER_APP_NAME: ca-tokenscopeigdctest-dev-weu

      # Exact application commit currently known to work in DEV.
      #
      # For the first TEST deployment, keep this fixed.
      # Later you can replace this with the newly approved DEV SHA.
      IMAGE_TAG: 308dde71df94ef0d049ac260b7067b277e28185a

    steps:

      # ============================================================
      # STEP 1: Checkout exact known-good DEV commit
      # ============================================================

      - name: Checkout Known-Good DEV Commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 308dde71df94ef0d049ac260b7067b277e28185a


      # ============================================================
      # STEP 2: Azure Login using TEST OIDC identity
      #
      # AZURE_CLIENT_ID comes from:
      #
      # GitHub
      # → Settings
      # → Environments
      # → test
      #
      # It should be the Client ID for:
      #
      # tokenscope-github-test-deployer
      # ============================================================

      - name: Azure Login using TEST OIDC
        uses: azure/login@0949e32778441b2c442592b7a0e6313466dc8f29
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}


      # ============================================================
      # STEP 3: Validate TEST subscription
      # ============================================================

      - name: Verify TEST Subscription
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_SUB=$(az account show \
            --query id \
            --output tsv)

          if [ "$ACTUAL_SUB" != "$EXPECTED_SUBSCRIPTION" ]; then

            echo "ERROR: Wrong Azure subscription."

            echo "Expected:"
            echo "$EXPECTED_SUBSCRIPTION"

            echo "Actual:"
            echo "$ACTUAL_SUB"

            exit 1

          fi

          echo "SUCCESS: TEST subscription validated."


      # ============================================================
      # STEP 4: Validate TEST target values
      #
      # These checks intentionally prevent this TEST workflow
      # from accidentally touching DEV or DEMO.
      # ============================================================

      - name: Verify TEST Target Values
        shell: bash
        run: |
          set -euo pipefail

          test "$AZURE_RESOURCE_GROUP" = \
            "rg-westeurope-t1-amd-test-helios-001"

          test "$ACR_NAME" = \
            "crtokenscopeigdctestdevweu"

          test "$CONTAINER_APP_NAME" = \
            "ca-tokenscopeigdctest-dev-weu"

          echo "SUCCESS: TEST target values validated."


      # ============================================================
      # STEP 5: Verify TEST Resource Group
      # ============================================================

      - name: Verify TEST Resource Group
        shell: bash
        run: |
          set -euo pipefail

          echo "TEST Resource Group:"
          echo "$AZURE_RESOURCE_GROUP"

          az group show \
            --name "$AZURE_RESOURCE_GROUP" \
            --output none

          echo "SUCCESS: TEST Resource Group exists."


      # ============================================================
      # STEP 6: Verify TEST ACR exists
      # ============================================================

      - name: Verify TEST ACR
        shell: bash
        run: |
          set -euo pipefail

          echo "TEST ACR:"
          echo "$ACR_NAME"

          az acr show \
            --name "$ACR_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output none

          echo "SUCCESS: TEST ACR exists."


      # ============================================================
      # STEP 7: Verify TEST Container App exists
      # ============================================================

      - name: Verify TEST Container App
        shell: bash
        run: |
          set -euo pipefail

          echo "TEST Container App:"
          echo "$CONTAINER_APP_NAME"

          az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output none

          echo "SUCCESS: TEST Container App exists."


      # ============================================================
      # STEP 8: Verify private TEST runner
      # ============================================================

      - name: Verify TEST Private Runner
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TEST Private Runner"
          echo "=========================================="

          echo "Runner name:"
          echo "$RUNNER_NAME"

          echo "Runner OS:"
          echo "$RUNNER_OS"

          echo "Hostname:"
          hostname

          echo ""
          echo "Docker:"

          docker --version

          docker info > /dev/null

          echo ""
          echo "Azure CLI:"

          az version

          echo ""
          echo "Git:"

          git --version

          echo ""

          echo "SUCCESS: TEST private runner validated."


      # ============================================================
      # STEP 9: Verify TEST ACR private DNS
      #
      # Expected:
      #
      # crtokenscopeigdctestdevweu.azurecr.io
      #
      # should ultimately resolve to a PRIVATE IP.
      # ============================================================

      - name: Verify TEST ACR Private DNS
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TEST ACR Private DNS"
          echo "=========================================="

          echo "Resolving:"
          echo "${ACR_NAME}.azurecr.io"

          getent hosts "${ACR_NAME}.azurecr.io"

          echo ""

          echo "SUCCESS: TEST ACR private DNS lookup completed."


      # ============================================================
      # STEP 10: Display TEST ACR security posture
      # ============================================================

      - name: Show TEST ACR Configuration
        shell: bash
        run: |
          set -euo pipefail

          az acr show \
            --name "$ACR_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "{Name:name,Sku:sku.name,PublicNetworkAccess:publicNetworkAccess,AdminUser:adminUserEnabled}" \
            --output table


      # ============================================================
      # STEP 11: Login to TEST ACR
      #
      # Authentication:
      #
      # GitHub OIDC
      # → tokenscope-github-test-deployer
      # → AcrPush
      # → TEST ACR
      # ============================================================

      - name: Login to Private TEST ACR
        shell: bash
        run: |
          set -euo pipefail

          echo "TEST ACR private DNS:"

          getent hosts "${ACR_NAME}.azurecr.io"

          echo ""

          echo "Logging into TEST ACR..."

          az acr login \
            --name "$ACR_NAME"

          echo "SUCCESS: Logged into private TEST ACR."


      # ============================================================
      # STEP 12: Build the exact known-good image
      # ============================================================

      - name: Build Known-Good TEST Docker Image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}"

          echo "=========================================="
          echo "Building TEST Image"
          echo "=========================================="

          echo "Image:"
          echo "${IMAGE}:${IMAGE_TAG}"

          docker build \
            -t "${IMAGE}:${IMAGE_TAG}" \
            .

          echo "SUCCESS: Known-good TEST Docker image built."


      # ============================================================
      # STEP 13: Push known-good image to TEST ACR
      # ============================================================

      - name: Push Known-Good TEST Docker Image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}"

          echo "Pushing:"
          echo "${IMAGE}:${IMAGE_TAG}"

          docker push "${IMAGE}:${IMAGE_TAG}"

          echo "SUCCESS: Known-good TEST image pushed."


      # ============================================================
      # STEP 14: Verify known-good image exists
      # ============================================================

      - name: Verify Known-Good TEST Image
        shell: bash
        run: |
          set -euo pipefail

          az acr repository show \
            --name "$ACR_NAME" \
            --image "${IMAGE_NAME}:${IMAGE_TAG}" \
            --output none

          echo "SUCCESS: Known-good TEST image exists in TEST ACR."


      # ============================================================
      # STEP 15: Show TEST ACR tags
      # ============================================================

      - name: Show TEST Image Tags
        shell: bash
        run: |
          set -euo pipefail

          az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$IMAGE_NAME" \
            --output table


      # ============================================================
      # STEP 16: Update TEST Container App
      # ============================================================

      - name: Update TEST Container App
        shell: bash
        run: |
          set -euo pipefail

          TEST_IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"

          echo "=========================================="
          echo "Deploying Known-Good Image to TEST"
          echo "=========================================="

          echo "Container App:"
          echo "$CONTAINER_APP_NAME"

          echo "Image:"
          echo "$TEST_IMAGE"

          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$TEST_IMAGE" \
            --output none

          echo "SUCCESS: Known-good DEV commit deployed to TEST."


      # ============================================================
      # STEP 17: Verify exact TEST image
      # ============================================================

      - name: Verify Deployed TEST Image
        shell: bash
        run: |
          set -euo pipefail

          DEPLOYED_IMAGE=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" \
            --output tsv)

          EXPECTED_IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"

          echo "Expected:"
          echo "$EXPECTED_IMAGE"

          echo ""

          echo "Deployed:"
          echo "$DEPLOYED_IMAGE"

          if [ "$DEPLOYED_IMAGE" != "$EXPECTED_IMAGE" ]; then

            echo "ERROR: TEST is not running the expected image."

            exit 1

          fi

          echo "SUCCESS: TEST is running the known-good DEV commit."


      # ============================================================
      # STEP 18: Verify TEST Container App revisions
      # ============================================================

      - name: Verify TEST Container App Revisions
        shell: bash
        run: |
          set -euo pipefail

          az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output table


      # ============================================================
      # STEP 19: Final TEST deployment summary
      # ============================================================

      - name: TEST Deployment Summary
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TokenScope TEST Image Deployment"
          echo "=========================================="

          echo ""

          echo "TEST Resource Group:"
          echo "$AZURE_RESOURCE_GROUP"

          echo ""

          echo "TEST ACR:"
          echo "$ACR_NAME"

          echo ""

          echo "TEST Container App:"
          echo "$CONTAINER_APP_NAME"

          echo ""

          echo "Known-Good Commit:"
          echo "$IMAGE_TAG"

          echo ""

          echo "Deployed Image:"
          echo "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"

          echo ""

          echo "SUCCESS: TEST image deployment completed."


      # ============================================================
      # STEP 20: Logout
      # ============================================================

      - name: Azure Logout
        if: always()
        shell: bash
        run: |
          az logout || true
