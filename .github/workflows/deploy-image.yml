name: Deploy TokenScope Image

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-acr-access:
    runs-on: ubuntu-latest

    environment: dev

    env:
      AZURE_RESOURCE_GROUP: rg-westeurope-t1-amd-dev-helios-001
      ACR_NAME: crtokenscopeigdcdevweu

    steps:
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Show Azure Account
        run: |
          echo "===== ACCOUNT ====="
          az account show

      - name: Show OIDC Service Principal
        run: |
          echo "===== SERVICE PRINCIPAL ====="
          az ad sp show \
            --id "${{ vars.AZURE_CLIENT_ID }}" \
            --output json || true

      - name: Show ACR Details
        run: |
          echo "===== ACR DETAILS ====="

          az acr show \
            --name "$ACR_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output json

      - name: Test ACR Access
        run: |
          echo "===== TEST ACR ACCESS ====="

          az acr repository list \
            --name "$ACR_NAME" \
            --output table

      - name: Test ACR Login
        run: |
          echo "===== TEST ACR LOGIN ====="

          az acr login \
            --name "$ACR_NAME"

      - name: Check ACR Health
        run: |
          echo "===== ACR HEALTH ====="

          az acr check-health \
            --name "$ACR_NAME" \
            --yes
