name: Debug ACR Access

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug-acr:
    runs-on: ubuntu-latest

    environment: dev

    env:
      AZURE_RESOURCE_GROUP: rg-westeurope-t1-amd-dev-helios-001
      ACR_NAME: crtokenscopeigdcdevweu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Show Azure Account
        run: |
          echo "===== ACCOUNT ====="
          az account show -o json

      - name: Show Current User
        run: |
          echo "===== USER ====="
          az account show --query user -o json

      - name: Show Service Principal
        run: |
          echo "===== SERVICE PRINCIPAL ====="

          az ad sp show \
            --id "${{ vars.AZURE_CLIENT_ID }}" \
            --query "{displayName:displayName,id:id,appId:appId}" \
            -o json

      - name: Show ACR Details
        run: |
          echo "===== ACR DETAILS ====="

          az acr show \
            --name "$ACR_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output json

      - name: Test ACR Repository Access
        continue-on-error: true
        run: |
          echo "===== TEST ACR REPOSITORY ACCESS ====="

          az acr repository list \
            --name "$ACR_NAME" \
            --output table

      - name: Test ACR Login
        continue-on-error: true
        run: |
          echo "===== TEST ACR LOGIN ====="

          az acr login \
            --name "$ACR_NAME"

      - name: Check ACR Health
        continue-on-error: true
        run: |
          echo "===== ACR HEALTH ====="

          az acr check-health \
            --name "$ACR_NAME" \
            --yes

      - name: Show Subscriptions
        run: |
          echo "===== SUBSCRIPTION ====="

          az account show \
            --query "{name:name,id:id,tenantId:tenantId}" \
            -o table
