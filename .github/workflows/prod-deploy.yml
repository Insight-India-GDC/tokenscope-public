
name: Deploy TokenScope PROD Infrastructure

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Review What-If or apply approved infrastructure'
        type: choice
        options:
          - what-if
          - apply
        default: what-if
        required: true

      confirm_production:
        description: 'For apply, enter DEPLOY-PROD'
        type: string
        default: ''
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: tokenscope-prod-infrastructure
  cancel-in-progress: false

jobs:
  deploy:
    name: PROD Infrastructure - ${{ inputs.mode }}

    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 120

    env:
      # ============================================================
      # PROD AZURE CONFIGURATION
      # ============================================================

      AZURE_RESOURCE_GROUP: rg-westeurope-t1-amd-prd-helios-002
      EXPECTED_SUBSCRIPTION: 3796cf20-cb96-4457-914f-397760fe5834
      AZURE_LOCATION: westeurope

      PARAM_FILE: infra/parameters/prod.bicepparam

      MODE: ${{ inputs.mode }}
      CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}

      # ============================================================
      # FRONT DOOR CONFIGURATION - CHANGE DIRECTLY HERE
      # ============================================================
      #
      # off:
      #   First private infrastructure deployment.
      #   Front Door remains disabled.
      #
      # create:
      #   Enable Azure Front Door Premium.
      #   Approve its Private Link request.
      #
      # finalize:
      #   Configure actual Front Door hostname,
      #   Front Door instance ID, Entra callback,
      #   and scheduled worker base URL.
      #
      # Do not return to off after finalization without
      # reviewing the infrastructure impact.

      FRONT_DOOR_PHASE: 'off'

      # Leave empty during off and create.
      # Populate using deployment outputs for finalize.

      FRONT_DOOR_HOSTNAME: ''
      FRONT_DOOR_INSTANCE_ID: ''

      # ============================================================
      # EXISTING PROD SECRETS
      # ============================================================

      PG_ADMIN_LOGIN: ${{ secrets.PG_ADMIN_LOGIN }}
      PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}

      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      HMAC_SESSION_KEY: ${{ secrets.HMAC_SESSION_KEY }}
      INTERNAL_WORKER_HMAC_KEY: ${{ secrets.INTERNAL_WORKER_HMAC_KEY }}

      OIDC_SESSION_SECRET: ${{ secrets.OIDC_SESSION_SECRET }}
      OIDC_AUTH_SESSION_SECRET: ${{ secrets.OIDC_AUTH_SESSION_SECRET }}
      OIDC_TOKEN_KEY: ${{ secrets.OIDC_TOKEN_KEY }}

      ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}

    steps:

      # ============================================================
      # STEP 1: CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # ============================================================
      # STEP 2: LOGIN TO AZURE USING PROD OIDC
      # ============================================================

      - name: Login to PROD Azure using OIDC
        uses: azure/login@0949e32778441b2c442592b7a0e6313466dc8f29
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ============================================================
      # STEP 3: VALIDATE PROD TARGET AND SECRETS
      # ============================================================

      - name: Validate PROD target and required secrets
        shell: bash
        env:
          CONFIGURED_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONFIGURED_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          CONFIGURED_LOCATION: ${{ vars.AZURE_LOCATION }}
        run: |
          set -euo pipefail

          echo "Validating PROD environment..."

          test -f infra/main.bicep || {
            echo "::error::infra/main.bicep missing"
            exit 1
          }

          test -f "$PARAM_FILE" || {
            echo "::error::PROD parameter file missing"
            exit 1
          }

          test "$CONFIGURED_RESOURCE_GROUP" = "$AZURE_RESOURCE_GROUP" || {
            echo "::error::PROD resource group mismatch"
            exit 1
          }

          test "$CONFIGURED_SUBSCRIPTION" = "$EXPECTED_SUBSCRIPTION" || {
            echo "::error::PROD subscription mismatch"
            exit 1
          }

          test "$CONFIGURED_LOCATION" = "$AZURE_LOCATION" || {
            echo "::error::PROD location mismatch"
            exit 1
          }

          ACTUAL_SUB="$(az account show --query id -o tsv)"

          test "$ACTUAL_SUB" = "$EXPECTED_SUBSCRIPTION" || {
            echo "::error::Wrong Azure subscription: $ACTUAL_SUB"
            exit 1
          }

          for name in \
            PG_ADMIN_LOGIN \
            PG_ADMIN_PASSWORD \
            SESSION_SECRET \
            HMAC_SESSION_KEY \
            INTERNAL_WORKER_HMAC_KEY \
            OIDC_SESSION_SECRET \
            OIDC_AUTH_SESSION_SECRET \
            OIDC_TOKEN_KEY \
            ENTRA_CLIENT_SECRET
          do
            test -n "${!name:-}" || {
              echo "::error::Missing PROD secret: $name"
              exit 1
            }
          done

          python3 - <<'PY'
          import os
          import base64
          import binascii

          try:
              data = base64.b64decode(
                  os.environ["OIDC_TOKEN_KEY"],
                  validate=True
              )
          except (ValueError, binascii.Error):
              raise SystemExit(
                  "ERROR: Invalid OIDC_TOKEN_KEY Base64"
              )

          if len(data) != 32:
              raise SystemExit(
                  "ERROR: OIDC_TOKEN_KEY must decode to 32 bytes"
              )

          print("SUCCESS: Required PROD secrets validated")
          PY

          if [ "$MODE" = "apply" ]; then
            test "$CONFIRM_PRODUCTION" = "DEPLOY-PROD" || {
              echo "::error::Apply requires DEPLOY-PROD"
              exit 1
            }
          fi

          az group show \
            --name "$AZURE_RESOURCE_GROUP" \
            --output none

          echo "SUCCESS: PROD target validated"

      # ============================================================
      # STEP 4: PREPARE FRONT DOOR PARAMETERS
      # ============================================================

      - name: Prepare Azure Front Door parameters
        shell: bash
        run: |
          set -euo pipefail

          case "$FRONT_DOOR_PHASE" in

            off)
              echo "ENABLE_FRONT_DOOR=false" >> "$GITHUB_ENV"
              echo "FRONT_DOOR_ID=" >> "$GITHUB_ENV"
              echo "APP_PUBLIC_ORIGIN=" >> "$GITHUB_ENV"
              echo "ENTRA_REDIRECT_URI=" >> "$GITHUB_ENV"
              echo "WORKER_BASE_URL=" >> "$GITHUB_ENV"

              echo "Front Door disabled."
              ;;

            create)
              echo "ENABLE_FRONT_DOOR=true" >> "$GITHUB_ENV"
              echo "FRONT_DOOR_ID=" >> "$GITHUB_ENV"
              echo "APP_PUBLIC_ORIGIN=" >> "$GITHUB_ENV"
              echo "ENTRA_REDIRECT_URI=" >> "$GITHUB_ENV"
              echo "WORKER_BASE_URL=" >> "$GITHUB_ENV"

              echo "Front Door creation enabled."
              ;;

            finalize)
              if ! [[ "$FRONT_DOOR_HOSTNAME" =~ ^[A-Za-z0-9.-]+$ ]]; then
                echo "::error::Invalid Front Door hostname"
                exit 1
              fi

              if ! [[ "$FRONT_DOOR_INSTANCE_ID" =~ ^[a-fA-F0-9-]{36}$ ]]; then
                echo "::error::Invalid Front Door instance ID"
                exit 1
              fi

              echo "ENABLE_FRONT_DOOR=true" >> "$GITHUB_ENV"
              echo "FRONT_DOOR_ID=$FRONT_DOOR_INSTANCE_ID" >> "$GITHUB_ENV"

              echo "APP_PUBLIC_ORIGIN=https://$FRONT_DOOR_HOSTNAME" >> "$GITHUB_ENV"

              echo "ENTRA_REDIRECT_URI=https://$FRONT_DOOR_HOSTNAME/auth/entra/callback" >> "$GITHUB_ENV"

              echo "WORKER_BASE_URL=https://$FRONT_DOOR_HOSTNAME" >> "$GITHUB_ENV"

              echo "Front Door finalization enabled."
              ;;

            *)
              echo "::error::Invalid Front Door phase: $FRONT_DOOR_PHASE"
              exit 1
              ;;

          esac

      # ============================================================
      # STEP 5: VALIDATE BICEP FILES
      # ============================================================

      - name: Validate PROD Bicep templates
        shell: bash
        run: |
          set -euo pipefail

          echo "Compiling PROD Bicep..."

          az bicep build \
            --file infra/main.bicep \
            --stdout > /dev/null

          az bicep build-params \
            --file "$PARAM_FILE" \
            --stdout > /dev/null

          echo "SUCCESS: PROD Bicep compilation completed"

      # ============================================================
      # STEP 6: VALIDATE ARM DEPLOYMENT
      # ============================================================

      - name: Validate PROD ARM deployment
        shell: bash
        run: |
          set -euo pipefail

          az deployment group validate \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters "$PARAM_FILE" \
              enableFrontDoor="$ENABLE_FRONT_DOOR" \
              frontDoorId="$FRONT_DOOR_ID" \
              appPublicOrigin="$APP_PUBLIC_ORIGIN" \
              entraIdRedirectUri="$ENTRA_REDIRECT_URI" \
              workerBaseUrl="$WORKER_BASE_URL" \
            --only-show-errors \
            --output none

          echo "SUCCESS: PROD ARM validation completed"

      # ============================================================
      # STEP 7: WHAT-IF PREVIEW WITH JSON OUTPUT FIX
      #
      # FIX:
      # --no-pretty-print enables JSON output.
      #
      # An empty or invalid response blocks deployment.
      # Delete and Unsupported changes also block it.
      # ============================================================

      - name: Review PROD infrastructure What-If
        shell: bash
        run: |
          set -euo pipefail

          echo "Running PROD infrastructure What-If..."

          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters "$PARAM_FILE" \
              enableFrontDoor="$ENABLE_FRONT_DOOR" \
              frontDoorId="$FRONT_DOOR_ID" \
              appPublicOrigin="$APP_PUBLIC_ORIGIN" \
              entraIdRedirectUri="$ENTRA_REDIRECT_URI" \
              workerBaseUrl="$WORKER_BASE_URL" \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            --output json > what-if.json

          if [ ! -s what-if.json ]; then
            echo "::error::Azure What-If returned empty output"
            exit 1
          fi

          python3 - <<'PY'
          import json
          import sys

          try:
              with open("what-if.json", encoding="utf-8") as f:
                  result = json.load(f)
          except (OSError, json.JSONDecodeError) as exc:
              print(f"ERROR: Invalid What-If JSON: {exc}")
              sys.exit(1)

          if not isinstance(result, dict):
              sys.exit("ERROR: Unexpected What-If format")

          changes = result.get("changes")

          if not isinstance(changes, list):
              sys.exit("ERROR: What-If changes list missing")

          print("\nPROD infrastructure changes:")
          print("=" * 60)

          blocked = []

          for item in changes:
              if not isinstance(item, dict):
                  sys.exit("ERROR: Invalid change entry")

              change_type = item.get("changeType", "Unknown")
              resource_id = item.get("resourceId", "Unknown")

              print(f"{change_type}: {resource_id}")

              if change_type in ("Delete", "Unsupported"):
                  blocked.append((change_type, resource_id))

          print("=" * 60)
          print(f"Total changes: {len(changes)}")

          if blocked:
              print("\nBLOCKED: Unsafe or unsupported changes")

              for change_type, resource_id in blocked:
                  print(f"{change_type}: {resource_id}")

              sys.exit(1)

          print("\nWhat-If JSON processed successfully.")
          print("No Delete/Unsupported changes detected.")
          print("Create/Modify/Deploy changes still require approval.")
          PY

          echo "SUCCESS: What-If processing completed"

      # ============================================================
      # STEP 8: APPLY APPROVED PROD INFRASTRUCTURE
      # ============================================================

      - name: Apply approved PROD infrastructure
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail

          DEPLOYMENT_NAME="tokenscope-prod-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "Applying approved PROD infrastructure..."

          az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters "$PARAM_FILE" \
              enableFrontDoor="$ENABLE_FRONT_DOOR" \
              frontDoorId="$FRONT_DOOR_ID" \
              appPublicOrigin="$APP_PUBLIC_ORIGIN" \
              entraIdRedirectUri="$ENTRA_REDIRECT_URI" \
              workerBaseUrl="$WORKER_BASE_URL" \
            --mode Incremental \
            --only-show-errors \
            --output none

          echo "DEPLOYMENT_NAME=$DEPLOYMENT_NAME" >> "$GITHUB_ENV"

          echo "SUCCESS: PROD infrastructure deployment completed"

      # ============================================================
      # STEP 9: SHOW DEPLOYMENT OUTPUTS
      # ============================================================

      - name: Show PROD deployment outputs
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail

          az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$DEPLOYMENT_NAME" \
            --query properties.outputs \
            --output json > deployment-outputs.json

          python3 - <<'PY'
          import json

          with open(
              "deployment-outputs.json",
              encoding="utf-8"
          ) as f:
              outputs = json.load(f)

          for key in (
              "acrLoginServer",
              "containerAppName",
              "frontDoorEndpointFqdn",
              "frontDoorInstanceId",
              "frontDoorPrivateLinkRequestMessage"
          ):
              value = outputs.get(key, {}).get("value", "")

              if value:
                  print(f"{key}: {value}")
          PY

      # ============================================================
      # STEP 10: DEPLOYMENT SUMMARY
      # ============================================================

      - name: PROD Deployment Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## TokenScope PROD Infrastructure"
            echo ""
            echo "- Mode: $MODE"
            echo "- Resource group: $AZURE_RESOURCE_GROUP"
            echo "- Subscription: $EXPECTED_SUBSCRIPTION"
            echo "- Location: $AZURE_LOCATION"
            echo "- Front Door phase: $FRONT_DOOR_PHASE"
            echo ""
            echo "What-If requires human review."
            echo "Front Door Private Link approval may be required."
            echo "Check Container App health and PostgreSQL readiness."
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # STEP 11: AZURE LOGOUT
      # ============================================================

      - name: Azure Logout
        if: always()
        shell: bash
        run: |
          az logout || true
