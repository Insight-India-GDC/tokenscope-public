name: Deploy TokenScope PROD Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type DEPLOY-PROD to deploy infrastructure'
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: tokenscope-prod-infrastructure
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy PROD Azure Infrastructure

    runs-on: ubuntu-latest

    environment: prod

    timeout-minutes: 120

    env:
      # ============================================================
      # PROD AZURE CONFIGURATION
      # ============================================================

      AZURE_RESOURCE_GROUP: rg-westeurope-t1-amd-prd-helios-002

      EXPECTED_SUBSCRIPTION: 3796cf20-cb96-4457-914f-397760fe5834

      AZURE_LOCATION: westeurope

      PARAM_FILE: infra/parameters/prod.bicepparam

      CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}

      # ============================================================
      # AZURE FRONT DOOR - CONTROL DIRECTLY IN CODE
      # ============================================================
      #
      # off:
      #   Front Door disabled.
      #
      # create:
      #   Create Front Door Premium.
      #
      # finalize:
      #   Configure Front Door instance ID,
      #   public URL, Entra callback and workers.
      #
      # Change this value when required.

      FRONT_DOOR_PHASE: 'off'

      # Fill these only during finalize.

      FRONT_DOOR_HOSTNAME: ''

      FRONT_DOOR_INSTANCE_ID: ''

      # ============================================================
      # PROD-ONLY POSTGRESQL AND ALERT SETTINGS
      # ============================================================
      #
      # Both changes apply ONLY to a temporary copy
      # during this GitHub Actions run.
      #
      # Original Bicep files are not changed.
      #
      # PostgreSQL:
      # Fix GeoZoneRedundantStorageAccountSkusNotFound.
      #
      # Monitoring:
      # Skip optional alert resources during this deployment.
      # Retain Log Analytics, App Insights, DCE, DCR,
      # managed identity RBAC and diagnostic settings.

      PROD_DISABLE_GEO_REDUNDANT_BACKUP: 'true'

      # TEMPORARY EXCEPTION: set true ONLY after PROD owner approves no HA.
      PROD_DISABLE_POSTGRES_HA: 'true'

      DEPLOY_MONITORING_ALERTS: 'false'

      DEPLOY_APP_ALERTS: 'false'

      # ============================================================
      # PROD APPLICATION SECRETS
      # ============================================================

      PG_ADMIN_LOGIN: ${{ secrets.PG_ADMIN_LOGIN }}

      PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}

      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      HMAC_SESSION_KEY: ${{ secrets.HMAC_SESSION_KEY }}

      INTERNAL_WORKER_HMAC_KEY: ${{ secrets.INTERNAL_WORKER_HMAC_KEY }}

      OIDC_SESSION_SECRET: ${{ secrets.OIDC_SESSION_SECRET }}

      OIDC_AUTH_SESSION_SECRET: ${{ secrets.OIDC_AUTH_SESSION_SECRET }}

      OIDC_TOKEN_KEY: ${{ secrets.OIDC_TOKEN_KEY }}

      ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}

    steps:

      # ============================================================
      # STEP 1: CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # ============================================================
      # STEP 2: AZURE LOGIN USING PROD OIDC
      # ============================================================

      - name: Azure Login using PROD OIDC
        uses: azure/login@0949e32778441b2c442592b7a0e6313466dc8f29
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ============================================================
      # STEP 3: VALIDATE PROD TARGET
      # ============================================================

      - name: Validate PROD Target and Confirmation
        shell: bash
        env:
          CONFIGURED_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONFIGURED_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          CONFIGURED_LOCATION: ${{ vars.AZURE_LOCATION }}
        run: |
          set -euo pipefail

          echo "Validating TokenScope PROD configuration..."

          test -f infra/main.bicep || {
            echo "::error::infra/main.bicep not found"
            exit 1
          }

          test -f "$PARAM_FILE" || {
            echo "::error::PROD parameter file not found"
            exit 1
          }

          test "$CONFIRM_PRODUCTION" = "DEPLOY-PROD" || {
            echo "::error::Type DEPLOY-PROD to continue"
            exit 1
          }

          test "$CONFIGURED_RESOURCE_GROUP" = "$AZURE_RESOURCE_GROUP" || {
            echo "::error::Resource group mismatch"
            exit 1
          }

          test "$CONFIGURED_SUBSCRIPTION" = "$EXPECTED_SUBSCRIPTION" || {
            echo "::error::Subscription mismatch"
            exit 1
          }

          test "$CONFIGURED_LOCATION" = "$AZURE_LOCATION" || {
            echo "::error::Location mismatch"
            exit 1
          }

          ACTUAL_SUB="$(az account show --query id -o tsv)"

          test "$ACTUAL_SUB" = "$EXPECTED_SUBSCRIPTION" || {
            echo "::error::Wrong Azure subscription: $ACTUAL_SUB"
            exit 1
          }

          az group show \
            --name "$AZURE_RESOURCE_GROUP" \
            --output none

          echo "SUCCESS: PROD subscription and resource group verified"

      # ============================================================
      # STEP 4: VALIDATE REQUIRED SECRETS
      # ============================================================

      - name: Validate PROD Secrets
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            PG_ADMIN_LOGIN \
            PG_ADMIN_PASSWORD \
            SESSION_SECRET \
            HMAC_SESSION_KEY \
            INTERNAL_WORKER_HMAC_KEY \
            OIDC_SESSION_SECRET \
            OIDC_AUTH_SESSION_SECRET \
            OIDC_TOKEN_KEY \
            ENTRA_CLIENT_SECRET
          do
            test -n "${!name:-}" || {
              echo "::error::Missing PROD secret: $name"
              exit 1
            }
          done

          python3 - <<'PY'
          import os
          import base64
          import binascii

          try:
              data = base64.b64decode(
                  os.environ["OIDC_TOKEN_KEY"],
                  validate=True
              )
          except (ValueError, binascii.Error):
              raise SystemExit("Invalid OIDC_TOKEN_KEY Base64")

          if len(data) != 32:
              raise SystemExit(
                  "OIDC_TOKEN_KEY must decode to 32 bytes"
              )

          print("SUCCESS: PROD secrets validated")
          PY

      # ============================================================
      # STEP 5: PREPARE FRONT DOOR PARAMETERS
      # ============================================================

      - name: Prepare Azure Front Door Parameters
        shell: bash
        run: |
          set -euo pipefail

          case "$FRONT_DOOR_PHASE" in

            off)
              echo "ENABLE_FRONT_DOOR=false" >> "$GITHUB_ENV"
              echo "FRONT_DOOR_ID=" >> "$GITHUB_ENV"
              echo "APP_PUBLIC_ORIGIN=" >> "$GITHUB_ENV"
              echo "ENTRA_REDIRECT_URI=" >> "$GITHUB_ENV"
              echo "WORKER_BASE_URL=" >> "$GITHUB_ENV"

              echo "Front Door disabled."
              ;;

            create)
              echo "ENABLE_FRONT_DOOR=true" >> "$GITHUB_ENV"
              echo "FRONT_DOOR_ID=" >> "$GITHUB_ENV"
              echo "APP_PUBLIC_ORIGIN=" >> "$GITHUB_ENV"
              echo "ENTRA_REDIRECT_URI=" >> "$GITHUB_ENV"
              echo "WORKER_BASE_URL=" >> "$GITHUB_ENV"

              echo "Front Door creation enabled."
              ;;

            finalize)
              [[ "$FRONT_DOOR_HOSTNAME" =~ ^[A-Za-z0-9.-]+$ ]] || {
                echo "::error::Invalid Front Door hostname"
                exit 1
              }

              [[ "$FRONT_DOOR_INSTANCE_ID" =~ ^[a-fA-F0-9-]{36}$ ]] || {
                echo "::error::Invalid Front Door instance ID"
                exit 1
              }

              echo "ENABLE_FRONT_DOOR=true" >> "$GITHUB_ENV"

              echo "FRONT_DOOR_ID=$FRONT_DOOR_INSTANCE_ID" >> "$GITHUB_ENV"

              echo "APP_PUBLIC_ORIGIN=https://$FRONT_DOOR_HOSTNAME" >> "$GITHUB_ENV"

              echo "ENTRA_REDIRECT_URI=https://$FRONT_DOOR_HOSTNAME/auth/entra/callback" >> "$GITHUB_ENV"

              echo "WORKER_BASE_URL=https://$FRONT_DOOR_HOSTNAME" >> "$GITHUB_ENV"

              echo "Front Door finalization enabled."
              ;;

            *)
              echo "::error::Invalid Front Door phase"
              exit 1
              ;;

          esac

      # ============================================================
      # STEP 6: PREPARE PROD-ONLY INFRASTRUCTURE OVERRIDES
      #
      # NEW:
      #   1. Fix PostgreSQL geo-redundant storage.
      #   2. Skip four monitoring metric alerts.
      #   3. Skip optional ops-alerts module.
      #
      # All changes made in a temporary copy.
      #
      # Original files remain unchanged in GitHub.
      # ============================================================

      - name: Prepare PROD PostgreSQL and Monitoring Overrides
        shell: bash
        run: |
          set -euo pipefail

          PROD_INFRA="$RUNNER_TEMP/tokenscope-prod-infra"

          mkdir -p "$PROD_INFRA"

          cp -a infra/. "$PROD_INFRA/"

          export PROD_INFRA

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROD_INFRA"])

          # PROD-only Container App name override
          container_file = root / "modules" / "container-app.bicep"
          
          content = container_file.read_text(encoding="utf-8")
          
          old_name = "name: 'ca-${name}'"
          new_name = "name: 'ca-ts-prod-weu'"
          
          if content.count(old_name) != 1:
              raise SystemExit("ERROR: Container App name expression not found exactly once")
          
          container_file.write_text(
              content.replace(old_name, new_name, 1),
              encoding="utf-8"
          )
          
          print("PROD Container App name: ca-ts-prod-weu")

          # ================================================
          # POSTGRESQL OVERRIDE
          # ================================================

          pg_file = root / "modules" / "postgresql.bicep"

          pg_content = pg_file.read_text(encoding="utf-8")

          old_backup = (
              "geoRedundantBackup: environment == 'production' "
              "? 'Enabled' : 'Disabled'"
          )

          new_backup = "geoRedundantBackup: 'Disabled'"

          if os.environ["PROD_DISABLE_GEO_REDUNDANT_BACKUP"] == "true":

              if pg_content.count(old_backup) != 1:
                  raise SystemExit(
                      "ERROR: PostgreSQL backup expression "
                      "not found exactly once."
                  )

              pg_content = pg_content.replace(
                  old_backup,
                  new_backup,
                  1
              )

              print("PostgreSQL geo-redundant backup disabled.")

          # PostgreSQL HA is separate from geo-redundant backup.
          # Only apply the PROD exception if explicitly enabled.
          if os.environ["PROD_DISABLE_POSTGRES_HA"] == "true":
              old_ha = (
                  "mode: environment == 'production' "
                  "? 'ZoneRedundant' : 'Disabled'"
              )
              new_ha = "mode: 'Disabled'"

              if pg_content.count(old_ha) != 1:
                  raise SystemExit(
                      "ERROR: PostgreSQL HA expression "
                      "not found exactly once."
                  )

              pg_content = pg_content.replace(old_ha, new_ha, 1)
              print("PostgreSQL HA disabled for PROD (approved exception).")

          pg_file.write_text(
              pg_content,
              encoding="utf-8"
          )
          print("PostgreSQL Bicep overrides saved to temporary copy.")


          # ================================================
          # MONITORING METRIC ALERT OVERRIDE
          # ================================================

          monitor_file = root / "modules" / "monitoring.bicep"

          monitor_content = monitor_file.read_text(
              encoding="utf-8"
          )

          if os.environ["DEPLOY_MONITORING_ALERTS"] == "false":

              alert_names = (
                  "errorRateAlert",
                  "responseTimeAlert",
                  "exceptionRateAlert",
                  "dependencyFailureAlert"
              )

              for alert_name in alert_names:

                  old_alert = (
                      f"resource {alert_name} "
                      "'Microsoft.Insights/metricAlerts@2018-03-01' = {"
                  )

                  new_alert = (
                      f"resource {alert_name} "
                      "'Microsoft.Insights/metricAlerts@2018-03-01' "
                      "= if (false) {"
                  )

                  if monitor_content.count(old_alert) != 1:
                      raise SystemExit(
                          f"ERROR: Alert not found: {alert_name}"
                      )

                  monitor_content = monitor_content.replace(
                      old_alert,
                      new_alert,
                      1
                  )

              monitor_file.write_text(
                  monitor_content,
                  encoding="utf-8"
              )

              print("Four monitoring metric alerts skipped.")
              print("Log Analytics and App Insights retained.")
              print("DCE, DCR and monitoring RBAC retained.")

          # ================================================
          # OPS ALERTS MODULE OVERRIDE
          # ================================================

          main_file = root / "main.bicep"

          main_content = main_file.read_text(
              encoding="utf-8"
          )

          if os.environ["DEPLOY_APP_ALERTS"] == "false":

              pattern = (
                  r"(module\s+opsAlerts\s+"
                  r"'modules/ops-alerts\.bicep'\s*=\s*)"
                  r"(?:if\s*\([^)]*\)\s*)?\{"
              )

              updated, count = re.subn(
                  pattern,
                  r"\g<1>if (false) {",
                  main_content
              )

              if count != 1:
                  raise SystemExit(
                      "ERROR: opsAlerts module declaration "
                      "not found exactly once."
                  )

              main_file.write_text(
                  updated,
                  encoding="utf-8"
              )

              print("Optional ops-alerts module skipped.")

          # ================================================
          # CONFIRM OVERRIDES
          # ================================================

          print("PROD temporary infrastructure prepared.")
          print("Original repository files remain unchanged.")
          PY

          echo "PROD_INFRA=$PROD_INFRA" >> "$GITHUB_ENV"


      # ============================================================
      # STEP 7: PREPARE TEMPORARY PROD PARAMETERS
      #
      # Fix: enableFrontDoor may be missing or formatted
      # differently in the existing PROD parameter file.
      #
      # Original repository files remain unchanged.
      # ============================================================

      - name: Prepare Temporary PROD Parameters
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROD_INFRA"])
          param_file = root / "parameters" / "prod.bicepparam"
          main_file = root / "main.bicep"

          if not param_file.is_file():
              raise SystemExit("PROD parameter file not found.")

          if not main_file.is_file():
              raise SystemExit("PROD main.bicep not found.")

          content = param_file.read_text(encoding="utf-8")
          main_content = main_file.read_text(encoding="utf-8")

          enabled = os.environ["ENABLE_FRONT_DOOR"]

          if enabled not in ("true", "false"):
              raise SystemExit("Invalid ENABLE_FRONT_DOOR value.")

          # Confirm this is a supported root Bicep parameter.
          if not re.search(
              r"\bparam\s+enableFrontDoor\s+bool\b",
              main_content
          ):
              raise SystemExit(
                  "main.bicep does not declare "
                  "param enableFrontDoor bool."
              )

          # Match existing declaration, including whitespace,
          # comments, and different values.
          pattern = (
              r"(?m)^[ \t]*param[ \t]+enableFrontDoor"
              r"[ \t]*=[ \t]*[^\r\n]*"
          )

          matches = list(re.finditer(pattern, content))

          if len(matches) > 1:
              raise SystemExit(
                  "Duplicate enableFrontDoor parameters found."
              )

          new_line = f"param enableFrontDoor = {enabled}"

          if len(matches) == 1:
              content = re.sub(
                  pattern,
                  new_line,
                  content,
                  count=1
              )
              print("Existing enableFrontDoor updated.")
          else:
              content = content.rstrip() + "\n\n" + new_line + "\n"
              print("Missing enableFrontDoor parameter added.")

          param_file.write_text(
              content,
              encoding="utf-8"
          )

          print(f"enableFrontDoor = {enabled}")
          print("Original repository files unchanged.")
          PY

          echo "PROD_PARAM_FILE=$PROD_INFRA/parameters/prod.bicepparam" \
            >> "$GITHUB_ENV"


      # ============================================================
      # STEP 8: VALIDATE BICEP FILES
      #
      # Original:
      #   infra/main.bicep
      #
      # Updated:
      #   Temporary PROD main.bicep
      # ============================================================

      - name: Validate PROD Bicep
        shell: bash
        run: |
          set -euo pipefail

          echo "Compiling PROD Bicep templates..."

          az bicep build \
            --file "$PROD_INFRA/main.bicep" \
            --stdout > /dev/null

          az bicep build-params \
            --file "$PROD_PARAM_FILE" \
            --stdout > /dev/null

          echo "SUCCESS: PROD Bicep compilation completed"

      # ============================================================
      # STEP 9: VALIDATE ARM DEPLOYMENT
      #
      # Uses the temporary PROD parameter file.
      # ============================================================

      - name: Validate PROD ARM Deployment
        shell: bash
        run: |
          set -euo pipefail

          az deployment group validate \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters "$PROD_PARAM_FILE" \
            --only-show-errors \
            --output none

          echo "SUCCESS: PROD ARM validation completed"

      # ============================================================
      # STEP 10: DEPLOY PROD INFRASTRUCTURE DIRECTLY
      #
      # NO WHAT-IF STEP.
      #
      # No changes to existing DEV/TEST files.
      # ============================================================

      - name: Deploy PROD Infrastructure
        shell: bash
        run: |
          set -euo pipefail

          DEPLOYMENT_NAME="tokenscope-prod-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "DEPLOYMENT_NAME=$DEPLOYMENT_NAME" >> "$GITHUB_ENV"

          echo "Deploying TokenScope PROD infrastructure..."

          az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters "$PROD_PARAM_FILE" \
            --mode Incremental \
            --only-show-errors \
            --output none

          echo "SUCCESS: PROD infrastructure deployment completed"

      # ============================================================
      # STEP 11: SHOW DEPLOYMENT OUTPUTS
      # ============================================================

      - name: Show PROD Deployment Outputs
        shell: bash
        run: |
          set -euo pipefail

          az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$DEPLOYMENT_NAME" \
            --query properties.outputs \
            --output json > deployment-outputs.json

          python3 - <<'PY'
          import json

          with open(
              "deployment-outputs.json",
              encoding="utf-8"
          ) as f:
              outputs = json.load(f)

          for key in (
              "acrLoginServer",
              "containerAppName",
              "containerAppUrl",
              "keyVaultName",
              "postgresqlServerName",
              "frontDoorEndpointFqdn",
              "frontDoorInstanceId",
              "frontDoorPrivateLinkRequestMessage"
          ):
              value = outputs.get(key, {}).get("value", "")

              if value:
                  print(f"{key}: {value}")
          PY

      # ============================================================
      # STEP 12: SUMMARY
      # ============================================================

      - name: PROD Deployment Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## TokenScope PROD Infrastructure"
            echo ""
            echo "- Resource group: $AZURE_RESOURCE_GROUP"
            echo "- Subscription: $EXPECTED_SUBSCRIPTION"
            echo "- Region: $AZURE_LOCATION"
            echo "- Front Door phase: $FRONT_DOOR_PHASE"
            echo ""
            echo "- PostgreSQL geo backup override: $PROD_DISABLE_GEO_REDUNDANT_BACKUP"
            echo "- PostgreSQL HA disabled (temporary exception): $PROD_DISABLE_POSTGRES_HA"
            echo "- Monitoring alerts enabled: $DEPLOY_MONITORING_ALERTS"
            echo "- Application alerts enabled: $DEPLOY_APP_ALERTS"
            echo ""
            echo "Shared repository Bicep files remain unchanged."
            echo ""
            echo "Infrastructure deploy completed only if apply succeeded."
            echo "Verify Container App health before image release."
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # STEP 13: LOGOUT
      # ============================================================

      - name: Azure Logout
        if: always()
        shell: bash
        run: |
          az logout || true
