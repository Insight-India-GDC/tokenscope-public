name: Deploy TokenScope PROD Infrastructure

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Review What-If or apply approved infrastructure'
        type: choice
        options: [what-if, apply]
        default: what-if
        required: true
      front_door_phase:
        description: 'off=private; create=Front Door; finalize=public URLs and workers'
        type: choice
        options: [off, create, finalize]
        default: off
        required: true
      front_door_hostname:
        description: 'Finalization only: Front Door hostname, without https://'
        type: string
        required: false
      front_door_instance_id:
        description: 'Finalization only: X-Azure-FDID from frontDoorInstanceId output'
        type: string
        required: false
      confirm_production:
        description: 'For apply enter DEPLOY-PROD'
        type: string
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: tokenscope-prod-infrastructure
  cancel-in-progress: false

jobs:
  deploy:
    name: PROD infrastructure ${{ inputs.mode }} / ${{ inputs.front_door_phase }}
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 120
    env:
      AZURE_RESOURCE_GROUP: rg-westeurope-t1-amd-prd-helios-002
      EXPECTED_SUBSCRIPTION: 3796cf20-cb96-4457-914f-397760fe5834
      AZURE_LOCATION: westeurope
      PARAM_FILE: infra/parameters/prod.bicepparam
      MODE: ${{ inputs.mode }}
      FRONT_DOOR_PHASE: ${{ inputs.front_door_phase }}
      FRONT_DOOR_HOSTNAME: ${{ inputs.front_door_hostname }}
      FRONT_DOOR_INSTANCE_ID: ${{ inputs.front_door_instance_id }}
      CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
      PG_ADMIN_LOGIN: ${{ secrets.PG_ADMIN_LOGIN }}
      PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      HMAC_SESSION_KEY: ${{ secrets.HMAC_SESSION_KEY }}
      INTERNAL_WORKER_HMAC_KEY: ${{ secrets.INTERNAL_WORKER_HMAC_KEY }}
      OIDC_SESSION_SECRET: ${{ secrets.OIDC_SESSION_SECRET }}
      OIDC_AUTH_SESSION_SECRET: ${{ secrets.OIDC_AUTH_SESSION_SECRET }}
      OIDC_TOKEN_KEY: ${{ secrets.OIDC_TOKEN_KEY }}
      ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Login to PROD Azure using OIDC
        uses: azure/login@0949e32778441b2c442592b7a0e6313466dc8f29
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate PROD target, secrets and phase
        shell: bash
        run: |
          set -euo pipefail
          test -f infra/main.bicep && test -f "$PARAM_FILE"
          test "${{ vars.AZURE_RESOURCE_GROUP }}" = "$AZURE_RESOURCE_GROUP"
          test "${{ vars.AZURE_SUBSCRIPTION_ID }}" = "$EXPECTED_SUBSCRIPTION"
          test "${{ vars.AZURE_LOCATION }}" = "$AZURE_LOCATION"
          test "$(az account show --query id -o tsv)" = "$EXPECTED_SUBSCRIPTION"
          for name in PG_ADMIN_LOGIN PG_ADMIN_PASSWORD SESSION_SECRET HMAC_SESSION_KEY INTERNAL_WORKER_HMAC_KEY OIDC_SESSION_SECRET OIDC_AUTH_SESSION_SECRET OIDC_TOKEN_KEY ENTRA_CLIENT_SECRET; do
            test -n "${!name:-}" || { echo "::error::Missing PROD secret $name"; exit 1; }
          done
          python3 - <<'PY'
          import os, base64, binascii
          try:
              data = base64.b64decode(os.environ['OIDC_TOKEN_KEY'], validate=True)
          except (ValueError, binascii.Error):
              raise SystemExit('Invalid OIDC_TOKEN_KEY base64')
          if len(data) != 32:
              raise SystemExit('OIDC_TOKEN_KEY must decode to exactly 32 bytes')
          PY
          if [ "$MODE" = 'apply' ]; then
            test "$CONFIRM_PRODUCTION" = 'DEPLOY-PROD' || { echo '::error::Expected DEPLOY-PROD'; exit 1; }
          fi
          if [ "$FRONT_DOOR_PHASE" = 'finalize' ]; then
            [[ "$FRONT_DOOR_HOSTNAME" =~ ^[A-Za-z0-9.-]+$ ]] || { echo '::error::Bad Front Door hostname'; exit 1; }
            [[ "$FRONT_DOOR_INSTANCE_ID" =~ ^[a-fA-F0-9-]{36}$ ]] || { echo '::error::Bad Front Door ID'; exit 1; }
          fi
          az group show -n "$AZURE_RESOURCE_GROUP" -o none

      - name: Prepare Front Door parameters
        shell: bash
        run: |
          set -euo pipefail
          case "$FRONT_DOOR_PHASE" in
            off)
              echo 'ENABLE_FRONT_DOOR=false' >> "$GITHUB_ENV"
              echo 'FRONT_DOOR_ID=' >> "$GITHUB_ENV"
              echo 'APP_PUBLIC_ORIGIN=' >> "$GITHUB_ENV"
              echo 'ENTRA_REDIRECT_URI=' >> "$GITHUB_ENV"
              echo 'WORKER_BASE_URL=' >> "$GITHUB_ENV"
              ;;
            create)
              echo 'ENABLE_FRONT_DOOR=true' >> "$GITHUB_ENV"
              echo 'FRONT_DOOR_ID=' >> "$GITHUB_ENV"
              echo 'APP_PUBLIC_ORIGIN=' >> "$GITHUB_ENV"
              echo 'ENTRA_REDIRECT_URI=' >> "$GITHUB_ENV"
              echo 'WORKER_BASE_URL=' >> "$GITHUB_ENV"
              ;;
            finalize)
              echo 'ENABLE_FRONT_DOOR=true' >> "$GITHUB_ENV"
              echo "FRONT_DOOR_ID=$FRONT_DOOR_INSTANCE_ID" >> "$GITHUB_ENV"
              echo "APP_PUBLIC_ORIGIN=https://$FRONT_DOOR_HOSTNAME" >> "$GITHUB_ENV"
              echo "ENTRA_REDIRECT_URI=https://$FRONT_DOOR_HOSTNAME/auth/entra/callback" >> "$GITHUB_ENV"
              echo "WORKER_BASE_URL=https://$FRONT_DOOR_HOSTNAME" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Validate Bicep and ARM deployment
        shell: bash
        run: |
          set -euo pipefail
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file "$PARAM_FILE" --stdout > /dev/null
          az deployment group validate \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters "$PARAM_FILE" enableFrontDoor="$ENABLE_FRONT_DOOR" \
            --only-show-errors --output none

      - name: Review PROD infrastructure What-If
        shell: bash
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters "$PARAM_FILE" enableFrontDoor="$ENABLE_FRONT_DOOR" \
            --result-format FullResourcePayloads --output json > what-if.json
          python3 - <<'PY'
          import json
          x = json.load(open('what-if.json', encoding='utf-8'))
          changes = x.get('changes', [])
          for item in changes:
              print(item.get('changeType'), item.get('resourceId'))
          if not changes:
              print('No changes returned; verify complete what-if output if unexpected.')
          blocked = [x for x in changes if x.get('changeType') in ('Delete', 'Unsupported')]
          if blocked:
              raise SystemExit('BLOCKED: Delete/Unsupported changes require remediation; no apply.')
          PY
          echo 'Review ALL creates/modifications, especially PostgreSQL, network, Key Vault and RBAC.'

      - name: Apply approved PROD infrastructure
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          # Requires an independently approved plan. What-If is not an approval.
          az deployment group create \
            --name "tokenscope-prod-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters "$PARAM_FILE" enableFrontDoor="$ENABLE_FRONT_DOOR" \
            --mode Incremental --only-show-errors --output json > result.json
          python3 - <<'PY'
          import json
          x = json.load(open('result.json', encoding='utf-8'))
          out = x.get('properties', {}).get('outputs', {})
          for key in ('acrLoginServer', 'containerAppName', 'frontDoorEndpointFqdn', 'frontDoorInstanceId'):
              value = out.get(key, {}).get('value', '')
              if value:
                  print(f'{key}: {value}')
          PY

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## PROD Infrastructure'
            echo "- Mode: $MODE"
            echo "- Phase: $FRONT_DOOR_PHASE"
            echo "- Resource group: $AZURE_RESOURCE_GROUP"
            echo '- Front Door Private Link approval may require an operator during apply.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Azure logout
        if: always()
        run: az logout || true
