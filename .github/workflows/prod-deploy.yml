name: Deploy TokenScope PROD Infrastructure

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview only, or apply approved infrastructure changes'
        type: choice
        options: [what-if, apply]
        default: what-if
        required: true
      enable_front_door:
        description: 'Enable Front Door only after private application health is verified'
        type: boolean
        default: false
        required: true
      confirm_production:
        description: 'When applying, type DEPLOY-PROD after reviewing What-If'
        type: string
        default: ''
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: tokenscope-prod-infrastructure
  cancel-in-progress: false

jobs:
  infrastructure:
    name: PROD infrastructure - ${{ inputs.mode }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      PARAM_FILE: infra/parameters/prod.bicepparam
      ENABLE_FRONT_DOOR: ${{ inputs.enable_front_door }}
      MODE: ${{ inputs.mode }}
      CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}

      # Consumed by readEnvironmentVariable(...) in prod.bicepparam
      PG_ADMIN_LOGIN: ${{ secrets.PG_ADMIN_LOGIN }}
      PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      HMAC_SESSION_KEY: ${{ secrets.HMAC_SESSION_KEY }}
      INTERNAL_WORKER_HMAC_KEY: ${{ secrets.INTERNAL_WORKER_HMAC_KEY }}
      OIDC_SESSION_SECRET: ${{ secrets.OIDC_SESSION_SECRET }}
      OIDC_AUTH_SESSION_SECRET: ${{ secrets.OIDC_AUTH_SESSION_SECRET }}
      OIDC_TOKEN_KEY: ${{ secrets.OIDC_TOKEN_KEY }}
      ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
      #ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IMAGE_TAG: ${{ vars.IMAGE_TAG }}
      FRONT_DOOR_ID: ${{ vars.FRONT_DOOR_ID }}
      APP_PUBLIC_ORIGIN: ${{ vars.APP_PUBLIC_ORIGIN }}
      ENTRA_REDIRECT_URI: ${{ vars.ENTRA_REDIRECT_URI }}
      WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Azure login using PROD OIDC
        uses: azure/login@0949e32778441b2c442592b7a0e6313466dc8f29
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate PROD targets and approvals
        shell: bash
        run: |
          set -euo pipefail
          test -f infra/main.bicep
          test -f "$PARAM_FILE"
          test -n "$AZURE_RESOURCE_GROUP"
          test -n "$EXPECTED_SUBSCRIPTION_ID"
          test "$(az account show --query id -o tsv)" = "$EXPECTED_SUBSCRIPTION_ID"
          test -n "$PG_ADMIN_LOGIN"
          test -n "$PG_ADMIN_PASSWORD"
          test -n "$SESSION_SECRET"
          test -n "$HMAC_SESSION_KEY"
          test -n "$INTERNAL_WORKER_HMAC_KEY"
          test -n "$OIDC_SESSION_SECRET"
          test -n "$OIDC_AUTH_SESSION_SECRET"
          test -n "$OIDC_TOKEN_KEY"
          test -n "$ENTRA_CLIENT_SECRET"
          test "$(printf '%s' "$OIDC_TOKEN_KEY" | base64 --decode | wc -c | tr -d ' ')" = '32'
          az group show --name "$AZURE_RESOURCE_GROUP" --output none
          if [ "$MODE" = 'apply' ]; then
            test "$CONFIRM_PRODUCTION" = 'DEPLOY-PROD' || {
              echo 'ERROR: apply requires confirmation DEPLOY-PROD'; exit 1;
            }
          fi
          echo 'PROD target validated. No resources modified.'

      - name: Validate Bicep templates and parameters
        shell: bash
        run: |
          set -euo pipefail
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file "$PARAM_FILE" --stdout > /dev/null
          az deployment group validate \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters "$PARAM_FILE" enableFrontDoor="$ENABLE_FRONT_DOOR" \
            --only-show-errors --output none

      - name: Preview infrastructure changes (What-If)
        shell: bash
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters "$PARAM_FILE" enableFrontDoor="$ENABLE_FRONT_DOOR" \
            --result-format ResourceIdOnly
          echo 'Review changes before selecting apply.'

      - name: Apply infrastructure changes (explicit approval required)
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          # IMPORTANT: Only run after reviewing What-If for PostgreSQL,
          # Key Vault, networking, RBAC and destructive or unsupported changes.
          # A successful What-If call alone is NOT an approval decision.
          az deployment group create \
            --name "tokenscope-prod-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters "$PARAM_FILE" enableFrontDoor="$ENABLE_FRONT_DOOR" \
            --mode Incremental \
            --only-show-errors --output json
          echo 'Azure infrastructure deployment completed successfully.'

      - name: Summarize result
        if: always()
        shell: bash
        run: |
          {
            echo '## TokenScope PROD Infrastructure'
            echo "- Mode: $MODE"
            echo "- Resource group: $AZURE_RESOURCE_GROUP"
            echo "- Front Door enabled: $ENABLE_FRONT_DOOR"
            echo '- What-If is not a comprehensive data-loss guarantee.'
            echo '- For fresh PROD, the first app image must exist before the Container App can pull it.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Azure logout
        if: always()
        shell: bash
        run: az logout || true
