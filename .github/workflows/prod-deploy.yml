name: Deploy TokenScope PROD - Complete (Existing Private ACR)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview or apply approved changes'
        type: choice
        options: [what-if, apply]
        default: what-if
        required: true
      front_door_phase:
        description: 'off=private only; create=Front Door; finalize=auth and workers'
        type: choice
        options: [off, create, finalize]
        default: off
        required: true
      front_door_hostname:
        description: 'For finalize only: actual Front Door hostname without https://'
        type: string
        required: false
      front_door_instance_id:
        description: 'For finalize only: frontDoorInstanceId from Bicep outputs (X-Azure-FDID)'
        type: string
        required: false
      confirm_production:
        description: 'For apply: type DEPLOY-PROD'
        type: string
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: tokenscope-prod-complete
  cancel-in-progress: false

jobs:
  deploy:
    name: PROD ${{ inputs.mode }} / Front Door ${{ inputs.front_door_phase }}
    runs-on: [self-hosted, Linux, X64, tokenscope-prod]
    environment: prod
    timeout-minutes: 120
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      EXPECTED_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      # Derived EXACTLY from main.bicep: nameSuffix = projectName-env-weu.
      # The ACR module uses replace('cr${nameSuffix}', '-', '').
      ACR_NAME: crtokenscopeigdcprodproductionweu
      IMAGE_NAME: tokenscope
      IMAGE_TAG: ${{ github.sha }}
      PARAM_FILE: infra/parameters/prod.bicepparam
      MODE: ${{ inputs.mode }}
      FRONT_DOOR_PHASE: ${{ inputs.front_door_phase }}
      FRONT_DOOR_HOSTNAME: ${{ inputs.front_door_hostname }}
      FRONT_DOOR_INSTANCE_ID: ${{ inputs.front_door_instance_id }}
      CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
      PG_ADMIN_LOGIN: ${{ secrets.PG_ADMIN_LOGIN }}
      PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      HMAC_SESSION_KEY: ${{ secrets.HMAC_SESSION_KEY }}
      INTERNAL_WORKER_HMAC_KEY: ${{ secrets.INTERNAL_WORKER_HMAC_KEY }}
      OIDC_SESSION_SECRET: ${{ secrets.OIDC_SESSION_SECRET }}
      OIDC_AUTH_SESSION_SECRET: ${{ secrets.OIDC_AUTH_SESSION_SECRET }}
      OIDC_TOKEN_KEY: ${{ secrets.OIDC_TOKEN_KEY }}
      ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}

    steps:
      - name: Checkout selected commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Azure login using PROD OIDC
        uses: azure/login@0949e32778441b2c442592b7a0e6313466dc8f29
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate PROD subscription, secrets and phase
        shell: bash
        run: |
          set -euo pipefail
          test -f infra/main.bicep
          test -f "$PARAM_FILE"
          test "$AZURE_RESOURCE_GROUP" = 'rg-westeurope-t1-amd-prd-helios-002'
          test "$EXPECTED_SUBSCRIPTION" = '3796cf20-cb96-4457-914f-397760fe5834'
          test "$AZURE_LOCATION" = 'westeurope'
          test "$(az account show --query id -o tsv)" = "$EXPECTED_SUBSCRIPTION"
          for name in PG_ADMIN_LOGIN PG_ADMIN_PASSWORD SESSION_SECRET HMAC_SESSION_KEY INTERNAL_WORKER_HMAC_KEY OIDC_SESSION_SECRET OIDC_AUTH_SESSION_SECRET OIDC_TOKEN_KEY ENTRA_CLIENT_SECRET; do
            test -n "${!name:-}" || { echo "::error::Missing PROD secret: $name"; exit 1; }
          done
          python3 - <<'PY'
          import os, base64, binascii
          try:
              v = base64.b64decode(os.environ['OIDC_TOKEN_KEY'], validate=True)
          except (ValueError, binascii.Error):
              raise SystemExit('OIDC_TOKEN_KEY must be valid base64')
          if len(v) != 32:
              raise SystemExit('OIDC_TOKEN_KEY must decode to 32 bytes')
          PY
          if [ "$MODE" = apply ]; then
            test "$CONFIRM_PRODUCTION" = 'DEPLOY-PROD' || { echo '::error::Confirm DEPLOY-PROD'; exit 1; }
          fi
          if [ "$FRONT_DOOR_PHASE" = finalize ]; then
            [[ "$FRONT_DOOR_HOSTNAME" =~ ^[a-zA-Z0-9.-]+$ ]] || { echo '::error::Invalid Front Door hostname'; exit 1; }
            [[ "$FRONT_DOOR_INSTANCE_ID" =~ ^[a-fA-F0-9-]{36}$ ]] || { echo '::error::Invalid Front Door instance ID'; exit 1; }
          fi
          az group show --name "$AZURE_RESOURCE_GROUP" --output none

      - name: Require existing private PROD ACR before image build
        shell: bash
        run: |
          set -euo pipefail
          if ! az acr show --name "$ACR_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --output none 2>/dev/null; then
            echo "::error::PROD ACR $ACR_NAME does not exist. main.bicep cannot safely bootstrap this private, image-dependent stack in one pass. Provision private ACR/networking/runner first."
            exit 1
          fi
          docker info >/dev/null
          getent ahostsv4 "${ACR_NAME}.azurecr.io"
          echo 'Check that this hostname resolves through the approved private network.'
          if [ "$MODE" = apply ]; then
            az acr login --name "$ACR_NAME"
          fi

      - name: Validate Bicep and prepare phase parameters
        shell: bash
        run: |
          set -euo pipefail
          az bicep build --file infra/main.bicep --stdout >/dev/null
          az bicep build-params --file "$PARAM_FILE" --stdout >/dev/null
          if [ "$FRONT_DOOR_PHASE" = off ]; then
            echo 'ENABLE_FRONT_DOOR=false' >> "$GITHUB_ENV"
          else
            echo 'ENABLE_FRONT_DOOR=true' >> "$GITHUB_ENV"
          fi
          if [ "$FRONT_DOOR_PHASE" = finalize ]; then
            echo "PUBLIC_ORIGIN=https://${FRONT_DOOR_HOSTNAME}" >> "$GITHUB_ENV"
            echo "REDIRECT_URI=https://${FRONT_DOOR_HOSTNAME}/auth/entra/callback" >> "$GITHUB_ENV"
          fi

      - name: Build and push selected immutable image
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          image="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"
          docker build -t "$image" .
          docker push "$image"
          az acr repository show --name "$ACR_NAME" --image "${IMAGE_NAME}:${IMAGE_TAG}" --output none

      - name: Preview infrastructure changes
        shell: bash
        run: |
          set -euo pipefail
          args=(enableFrontDoor="$ENABLE_FRONT_DOOR" imageTag="$IMAGE_TAG")
          if [ "$FRONT_DOOR_PHASE" = finalize ]; then
            args+=(frontDoorId="$FRONT_DOOR_INSTANCE_ID" appPublicOrigin="$PUBLIC_ORIGIN" workerBaseUrl="$PUBLIC_ORIGIN" entraIdRedirectUri="$REDIRECT_URI")
          fi
          az deployment group validate --resource-group "$AZURE_RESOURCE_GROUP" --parameters "$PARAM_FILE" "${args[@]}" --only-show-errors --output none
          az deployment group what-if --resource-group "$AZURE_RESOURCE_GROUP" --parameters "$PARAM_FILE" "${args[@]}" --result-format FullResourcePayloads
          az deployment group what-if --resource-group "$AZURE_RESOURCE_GROUP" --parameters "$PARAM_FILE" "${args[@]}" --output json > prod-whatif.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('prod-whatif.json', encoding='utf-8'))
          bad = [(c.get('changeType'), c.get('resourceId')) for c in data.get('changes', []) if c.get('changeType') in ('Delete','Unsupported')]
          for kind, resource in bad:
              print(f'BLOCKED {kind}: {resource}')
          if bad and os.environ['MODE'] == 'apply':
              raise SystemExit('Refusing apply: Delete/Unsupported changes must be investigated')
          PY
          echo 'What-If is informational for all other change types. The production reviewer must approve the changes separately.'

      - name: Deploy approved PROD infrastructure
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(enableFrontDoor="$ENABLE_FRONT_DOOR" imageTag="$IMAGE_TAG")
          if [ "$FRONT_DOOR_PHASE" = finalize ]; then
            args+=(frontDoorId="$FRONT_DOOR_INSTANCE_ID" appPublicOrigin="$PUBLIC_ORIGIN" workerBaseUrl="$PUBLIC_ORIGIN" entraIdRedirectUri="$REDIRECT_URI")
          fi
          deploy_name="tokenscope-prod-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az deployment group create --name "$deploy_name" --resource-group "$AZURE_RESOURCE_GROUP" --parameters "$PARAM_FILE" "${args[@]}" --mode Incremental --only-show-errors --output json > deployment-result.json
          python3 - <<'PY'
          import json
          result = json.load(open('deployment-result.json', encoding='utf-8'))
          outputs = result.get('properties', {}).get('outputs', {})
          for key in ('containerAppName','acrLoginServer','frontDoorEndpointFqdn','frontDoorInstanceId'):
              print(f'{key}: {outputs.get(key,{}).get("value", "not returned")}')
          PY
          app_name="$(python3 -c 'import json; print(json.load(open("deployment-result.json"))["properties"]["outputs"]["containerAppName"]["value"])')"
          test -n "$app_name"
          echo "CONTAINER_APP_NAME=$app_name" >> "$GITHUB_ENV"

      - name: Deploy and verify selected PROD image
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          image="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"
          az containerapp update --name "$CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --image "$image" --output none
          actual="$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query 'properties.template.containers[0].image' -o tsv)"
          test "$actual" = "$image" || { echo "::error::Deployed image mismatch: $actual"; exit 1; }
          az containerapp revision list --name "$CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --output table
          echo "Configured image: $actual"
          echo 'Verify revision health, sign-in, DB connectivity and application data before promoting traffic.'

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## TokenScope PROD'
            echo "- Mode: $MODE"
            echo "- Phase: $FRONT_DOOR_PHASE"
            echo "- Resource group: $AZURE_RESOURCE_GROUP"
            echo "- Image SHA: $IMAGE_TAG"
            echo '- Finalize requires approved Front Door Private Link and Entra callback registration.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Azure logout
        if: always()
        shell: bash
        run: az logout || true
