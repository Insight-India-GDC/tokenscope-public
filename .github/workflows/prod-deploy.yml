name: Deploy TokenScope PROD Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type DEPLOY-PROD to deploy infrastructure'
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: tokenscope-prod-infrastructure
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy PROD Azure Infrastructure

    runs-on:
      - self-hosted
      - Linux
      - X64
      - tokenscope-prod

    environment: prod

    timeout-minutes: 120

    env:
      # ============================================================
      # PROD AZURE CONFIGURATION
      # ============================================================

      AZURE_RESOURCE_GROUP: rg-westeurope-t1-amd-prd-helios-002

      EXPECTED_SUBSCRIPTION: 3796cf20-cb96-4457-914f-397760fe5834

      AZURE_LOCATION: westeurope

      PARAM_FILE: infra/parameters/prod.bicepparam

      CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}

      # ============================================================
      # AZURE FRONT DOOR - CONTROL DIRECTLY IN CODE
      # ============================================================
      #
      # off:      Front Door disabled.
      # create:   Create Front Door Premium (one profile only).
      # finalize: Configure Front Door instance ID, public URL,
      #           Entra callback and workers.

      FRONT_DOOR_PHASE: 'off'

      # Fill these only during finalize.

      FRONT_DOOR_HOSTNAME: ''

      FRONT_DOOR_INSTANCE_ID: ''

      # ============================================================
      # PROD-ONLY POSTGRESQL AND ALERT SETTINGS
      # ============================================================
      #
      # Applied ONLY to a temporary copy during this run.
      # Original Bicep files are not changed.

      PROD_DISABLE_GEO_REDUNDANT_BACKUP: 'true'

      # TEMPORARY EXCEPTION: set true ONLY after PROD owner approves no HA.
      PROD_DISABLE_POSTGRES_HA: 'true'

      DEPLOY_MONITORING_ALERTS: 'false'

      DEPLOY_APP_ALERTS: 'false'

      # ============================================================
      # EXISTING RUNNER SUBNET (created outside Bicep)
      # ============================================================
      #
      # Fixes:
      #   - InUseSubnetCannotBeDeleted   (subnet kept in template)
      #   - Runner NSG detached          (NSG kept on runner subnet)
      #   - Runner goes Offline          (NAT gateway kept)
      #
      # The runner subnet MUST have a NAT gateway attached before
      # this workflow runs. Otherwise the run stops at Step 7B.

      RUNNER_SUBNET_NAME: 'snet-github-runner'

      RUNNER_SUBNET_EXPECTED_NSG: 'nsg-tokenscope-prod-github-runner'

      # Old, unused subnets that the deployment may remove.
      # Space-separated. Each is checked in Azure first: the run
      # stops if it still has any NIC, private endpoint or link.

      ALLOWED_SUBNET_REMOVALS: 'snet-build'

      # ============================================================
      # PROD APPLICATION SECRETS
      # ============================================================

      PG_ADMIN_LOGIN: ${{ secrets.PG_ADMIN_LOGIN }}

      PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}

      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      HMAC_SESSION_KEY: ${{ secrets.HMAC_SESSION_KEY }}

      INTERNAL_WORKER_HMAC_KEY: ${{ secrets.INTERNAL_WORKER_HMAC_KEY }}

      OIDC_SESSION_SECRET: ${{ secrets.OIDC_SESSION_SECRET }}

      OIDC_AUTH_SESSION_SECRET: ${{ secrets.OIDC_AUTH_SESSION_SECRET }}

      OIDC_TOKEN_KEY: ${{ secrets.OIDC_TOKEN_KEY }}

      ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}

    steps:

      # ============================================================
      # STEP 1: CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # ============================================================
      # STEP 2: AZURE LOGIN USING PROD OIDC
      # ============================================================

      - name: Azure Login using PROD OIDC
        uses: azure/login@0949e32778441b2c442592b7a0e6313466dc8f29
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ============================================================
      # STEP 3: VALIDATE PROD TARGET
      # ============================================================

      - name: Validate PROD Target and Confirmation
        shell: bash
        env:
          CONFIGURED_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONFIGURED_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          CONFIGURED_LOCATION: ${{ vars.AZURE_LOCATION }}
        run: |
          set -euo pipefail

          echo "Validating TokenScope PROD configuration..."

          test -f infra/main.bicep || {
            echo "::error::infra/main.bicep not found"
            exit 1
          }

          test -f "$PARAM_FILE" || {
            echo "::error::PROD parameter file not found"
            exit 1
          }

          test "$CONFIRM_PRODUCTION" = "DEPLOY-PROD" || {
            echo "::error::Type DEPLOY-PROD to continue"
            exit 1
          }

          test "$CONFIGURED_RESOURCE_GROUP" = "$AZURE_RESOURCE_GROUP" || {
            echo "::error::Resource group mismatch"
            exit 1
          }

          test "$CONFIGURED_SUBSCRIPTION" = "$EXPECTED_SUBSCRIPTION" || {
            echo "::error::Subscription mismatch"
            exit 1
          }

          test "$CONFIGURED_LOCATION" = "$AZURE_LOCATION" || {
            echo "::error::Location mismatch"
            exit 1
          }

          ACTUAL_SUB="$(az account show --query id -o tsv)"

          test "$ACTUAL_SUB" = "$EXPECTED_SUBSCRIPTION" || {
            echo "::error::Wrong Azure subscription: $ACTUAL_SUB"
            exit 1
          }

          az group show \
            --name "$AZURE_RESOURCE_GROUP" \
            --output none

          command -v jq >/dev/null || {
            echo "::error::jq is not installed on the runner (sudo apt-get install -y jq)"
            exit 1
          }

          echo "SUCCESS: PROD subscription and resource group verified"

      # ============================================================
      # STEP 3B: WAIT FOR ANY RUNNING DEPLOYMENT
      #
      # Prevents DeploymentActive conflicts with a previous run
      # that is still running in Azure.
      # ============================================================

      - name: Wait for Running Deployments
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 40); do
            RUNNING="$(az deployment group list \
              -g "$AZURE_RESOURCE_GROUP" \
              --query "[?properties.provisioningState=='Running' || properties.provisioningState=='Accepted'].name" \
              -o tsv)"

            if [ -z "$RUNNING" ]; then
              echo "No running deployments."
              exit 0
            fi

            echo "Waiting for running deployment(s): $RUNNING (attempt $i/40)"
            sleep 30
          done

          echo "::error::A previous deployment is still running after 20 minutes."
          exit 1

      # ============================================================
      # STEP 4: VALIDATE REQUIRED SECRETS
      # ============================================================

      - name: Validate PROD Secrets
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            PG_ADMIN_LOGIN \
            PG_ADMIN_PASSWORD \
            SESSION_SECRET \
            HMAC_SESSION_KEY \
            INTERNAL_WORKER_HMAC_KEY \
            OIDC_SESSION_SECRET \
            OIDC_AUTH_SESSION_SECRET \
            OIDC_TOKEN_KEY \
            ENTRA_CLIENT_SECRET
          do
            test -n "${!name:-}" || {
              echo "::error::Missing PROD secret: $name"
              exit 1
            }
          done

          python3 - <<'PY'
          import os
          import base64
          import binascii

          try:
              data = base64.b64decode(
                  os.environ["OIDC_TOKEN_KEY"],
                  validate=True
              )
          except (ValueError, binascii.Error):
              raise SystemExit("Invalid OIDC_TOKEN_KEY Base64")

          if len(data) != 32:
              raise SystemExit("OIDC_TOKEN_KEY must decode to 32 bytes")

          print("SUCCESS: PROD secrets validated")
          PY

      # ============================================================
      # STEP 5: PREPARE FRONT DOOR PARAMETERS
      # ============================================================

      - name: Prepare Azure Front Door Parameters
        shell: bash
        run: |
          set -euo pipefail

          case "$FRONT_DOOR_PHASE" in

            off)
              echo "ENABLE_FRONT_DOOR=false" >> "$GITHUB_ENV"
              echo "FRONT_DOOR_ID=" >> "$GITHUB_ENV"
              echo "APP_PUBLIC_ORIGIN=" >> "$GITHUB_ENV"
              echo "ENTRA_REDIRECT_URI=" >> "$GITHUB_ENV"
              echo "WORKER_BASE_URL=" >> "$GITHUB_ENV"
              echo "Front Door disabled."
              ;;

            create)
              echo "ENABLE_FRONT_DOOR=true" >> "$GITHUB_ENV"
              echo "FRONT_DOOR_ID=" >> "$GITHUB_ENV"
              echo "APP_PUBLIC_ORIGIN=" >> "$GITHUB_ENV"
              echo "ENTRA_REDIRECT_URI=" >> "$GITHUB_ENV"
              echo "WORKER_BASE_URL=" >> "$GITHUB_ENV"
              echo "Front Door creation enabled."
              ;;

            finalize)
              [[ "$FRONT_DOOR_HOSTNAME" =~ ^[A-Za-z0-9.-]+$ ]] || {
                echo "::error::Invalid Front Door hostname"
                exit 1
              }

              [[ "$FRONT_DOOR_INSTANCE_ID" =~ ^[a-fA-F0-9-]{36}$ ]] || {
                echo "::error::Invalid Front Door instance ID"
                exit 1
              }

              echo "ENABLE_FRONT_DOOR=true" >> "$GITHUB_ENV"
              echo "FRONT_DOOR_ID=$FRONT_DOOR_INSTANCE_ID" >> "$GITHUB_ENV"
              echo "APP_PUBLIC_ORIGIN=https://$FRONT_DOOR_HOSTNAME" >> "$GITHUB_ENV"
              echo "ENTRA_REDIRECT_URI=https://$FRONT_DOOR_HOSTNAME/auth/entra/callback" >> "$GITHUB_ENV"
              echo "WORKER_BASE_URL=https://$FRONT_DOOR_HOSTNAME" >> "$GITHUB_ENV"
              echo "Front Door finalization enabled."
              ;;

            *)
              echo "::error::Invalid Front Door phase"
              exit 1
              ;;

          esac

      # ============================================================
      # STEP 6: PREPARE PROD-ONLY INFRASTRUCTURE OVERRIDES
      #
      #   1. Container App name override.
      #   2. PostgreSQL geo-redundant backup / HA.
      #   3. Skip four monitoring metric alerts.
      #   4. Skip optional ops-alerts module.
      #
      # All changes made in a temporary copy.
      # ============================================================

      - name: Prepare PROD PostgreSQL and Monitoring Overrides
        shell: bash
        run: |
          set -euo pipefail

          PROD_INFRA="$RUNNER_TEMP/tokenscope-prod-infra"

          rm -rf "$PROD_INFRA"
          mkdir -p "$PROD_INFRA"

          cp -a infra/. "$PROD_INFRA/"

          export PROD_INFRA

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROD_INFRA"])

          # ================================================
          # CONTAINER APP NAME OVERRIDE
          # ================================================

          container_file = root / "modules" / "container-app.bicep"
          content = container_file.read_text(encoding="utf-8")

          old_name = "name: 'ca-${name}'"
          new_name = "name: 'ca-ts-prod-weu'"

          if content.count(old_name) != 1:
              raise SystemExit("ERROR: Container App name expression not found exactly once")

          container_file.write_text(content.replace(old_name, new_name, 1), encoding="utf-8")
          print("PROD Container App name: ca-ts-prod-weu")

          # ================================================
          # POSTGRESQL OVERRIDE
          # ================================================

          pg_file = root / "modules" / "postgresql.bicep"
          pg_content = pg_file.read_text(encoding="utf-8")

          if os.environ["PROD_DISABLE_GEO_REDUNDANT_BACKUP"] == "true":
              old_backup = "geoRedundantBackup: environment == 'production' ? 'Enabled' : 'Disabled'"
              new_backup = "geoRedundantBackup: 'Disabled'"

              if pg_content.count(old_backup) != 1:
                  raise SystemExit("ERROR: PostgreSQL backup expression not found exactly once.")

              pg_content = pg_content.replace(old_backup, new_backup, 1)
              print("PostgreSQL geo-redundant backup disabled.")

          if os.environ["PROD_DISABLE_POSTGRES_HA"] == "true":
              old_ha = "mode: environment == 'production' ? 'ZoneRedundant' : 'Disabled'"
              new_ha = "mode: 'Disabled'"

              if pg_content.count(old_ha) != 1:
                  raise SystemExit("ERROR: PostgreSQL HA expression not found exactly once.")

              pg_content = pg_content.replace(old_ha, new_ha, 1)
              print("PostgreSQL HA disabled for PROD (approved exception).")

          pg_file.write_text(pg_content, encoding="utf-8")

          # ================================================
          # MONITORING METRIC ALERT OVERRIDE
          # ================================================

          monitor_file = root / "modules" / "monitoring.bicep"
          monitor_content = monitor_file.read_text(encoding="utf-8")

          if os.environ["DEPLOY_MONITORING_ALERTS"] == "false":
              for alert_name in (
                  "errorRateAlert",
                  "responseTimeAlert",
                  "exceptionRateAlert",
                  "dependencyFailureAlert"
              ):
                  old_alert = f"resource {alert_name} 'Microsoft.Insights/metricAlerts@2018-03-01' = {{"
                  new_alert = f"resource {alert_name} 'Microsoft.Insights/metricAlerts@2018-03-01' = if (false) {{"

                  if monitor_content.count(old_alert) != 1:
                      raise SystemExit(f"ERROR: Alert not found: {alert_name}")

                  monitor_content = monitor_content.replace(old_alert, new_alert, 1)

              monitor_file.write_text(monitor_content, encoding="utf-8")
              print("Four monitoring metric alerts skipped.")

          # ================================================
          # OPS ALERTS MODULE OVERRIDE
          # ================================================

          main_file = root / "main.bicep"
          main_content = main_file.read_text(encoding="utf-8")

          if os.environ["DEPLOY_APP_ALERTS"] == "false":
              pattern = (
                  r"(module\s+opsAlerts\s+"
                  r"'modules/ops-alerts\.bicep'\s*=\s*)"
                  r"(?:if\s*\([^)]*\)\s*)?\{"
              )

              updated, count = re.subn(pattern, r"\g<1>if (false) {", main_content)

              if count != 1:
                  raise SystemExit("ERROR: opsAlerts module declaration not found exactly once.")

              main_file.write_text(updated, encoding="utf-8")
              print("Optional ops-alerts module skipped.")

          print("PROD temporary infrastructure prepared. Repository files unchanged.")
          PY

          echo "PROD_INFRA=$PROD_INFRA" >> "$GITHUB_ENV"

      # ============================================================
      # STEP 7: PREPARE TEMPORARY PROD PARAMETERS (Front Door)
      # ============================================================

      - name: Prepare Temporary PROD Parameters
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROD_INFRA"])
          param_file = root / "parameters" / "prod.bicepparam"
          main_file = root / "main.bicep"

          if not param_file.is_file():
              raise SystemExit("PROD parameter file not found.")

          content = param_file.read_text(encoding="utf-8")
          main_content = main_file.read_text(encoding="utf-8")

          enabled = os.environ["ENABLE_FRONT_DOOR"]

          if enabled not in ("true", "false"):
              raise SystemExit("Invalid ENABLE_FRONT_DOOR value.")

          if not re.search(r"\bparam\s+enableFrontDoor\s+bool\b", main_content):
              raise SystemExit("main.bicep does not declare param enableFrontDoor bool.")

          def set_param(text, name, value_literal):
              pattern = rf"(?m)^[ \t]*param[ \t]+{name}[ \t]*=[^\r\n]*"
              line = f"param {name} = {value_literal}"
              found = re.findall(pattern, text)
              if len(found) > 1:
                  raise SystemExit(f"Duplicate {name} parameters found.")
              if found:
                  return re.sub(pattern, line, text, count=1)
              return text.rstrip() + "\n\n" + line + "\n"

          content = set_param(content, "enableFrontDoor", enabled)

          if enabled == "true":
              content = set_param(content, "frontDoorSku", "'Premium'")

          if os.environ["FRONT_DOOR_PHASE"] == "finalize":
              content = set_param(content, "frontDoorId", f"'{os.environ['FRONT_DOOR_ID']}'")
              content = set_param(content, "appPublicOrigin", f"'{os.environ['APP_PUBLIC_ORIGIN']}'")
              content = set_param(content, "entraIdRedirectUri", f"'{os.environ['ENTRA_REDIRECT_URI']}'")
              content = set_param(content, "workerBaseUrl", f"'{os.environ['WORKER_BASE_URL']}'")
              print("Front Door finalize values applied.")

          param_file.write_text(content, encoding="utf-8")

          print(f"enableFrontDoor = {enabled}")
          print("Original repository files unchanged.")
          PY

          echo "PROD_PARAM_FILE=$PROD_INFRA/parameters/prod.bicepparam" >> "$GITHUB_ENV"

      # ============================================================
      # STEP 7B: PRESERVE RUNNER SUBNET, NSG AND NAT GATEWAY
      #
      # Fixes:
      #   - InUseSubnetCannotBeDeleted for snet-github-runner
      #   - NSG detached from runner subnet
      #   - Runner offline because outbound internet removed
      #
      # Reads the live runner subnet from Azure and declares it,
      # with its NSG and NAT gateway, in the TEMPORARY template.
      # ============================================================

      - name: Preserve Runner Subnet, NSG and NAT Gateway
        shell: bash
        run: |
          set -euo pipefail

          VNET_NAME="$(az network vnet list \
            -g "$AZURE_RESOURCE_GROUP" \
            --query "[?subnets[?name=='$RUNNER_SUBNET_NAME']].name | [0]" \
            -o tsv)"

          test -n "$VNET_NAME" || {
            echo "::error::No VNet in $AZURE_RESOURCE_GROUP contains $RUNNER_SUBNET_NAME"
            exit 1
          }

          SUBNET_JSON="$(az network vnet subnet show \
            -g "$AZURE_RESOURCE_GROUP" \
            --vnet-name "$VNET_NAME" \
            -n "$RUNNER_SUBNET_NAME" \
            -o json)"

          RUNNER_PREFIX="$(jq -r '.addressPrefix // .addressPrefixes[0] // empty' <<< "$SUBNET_JSON")"
          RUNNER_NSG="$(jq -r '.networkSecurityGroup.id // empty' <<< "$SUBNET_JSON")"
          RUNNER_RT="$(jq -r '.routeTable.id // empty' <<< "$SUBNET_JSON")"
          RUNNER_NAT_ID="$(jq -r '.natGateway.id // empty' <<< "$SUBNET_JSON")"

          echo "VNet:          $VNET_NAME"
          echo "Runner subnet: $RUNNER_SUBNET_NAME"
          echo "Prefix:        $RUNNER_PREFIX"
          echo "NSG:           ${RUNNER_NSG:-none}"
          echo "NAT gateway:   ${RUNNER_NAT_ID:-none}"
          echo "Route table:   ${RUNNER_RT:-none}"

          [[ "$RUNNER_PREFIX" =~ ^[0-9.]+/[0-9]+$ ]] || {
            echo "::error::Invalid runner subnet prefix: $RUNNER_PREFIX"
            exit 1
          }

          test -z "$RUNNER_RT" || {
            echo "::error::$RUNNER_SUBNET_NAME has a route table. This workflow does not preserve route tables."
            exit 1
          }

          test -n "$RUNNER_NSG" || {
            echo "::error::$RUNNER_SUBNET_NAME has no NSG. Expected $RUNNER_SUBNET_EXPECTED_NSG."
            exit 1
          }

          test "${RUNNER_NSG##*/}" = "$RUNNER_SUBNET_EXPECTED_NSG" || {
            echo "::error::Unexpected NSG on runner subnet: ${RUNNER_NSG##*/}"
            exit 1
          }

          test -n "$RUNNER_NAT_ID" || {
            echo "::error::$RUNNER_SUBNET_NAME has no NAT gateway."
            echo "::error::Without it the runner loses internet during deployment and goes Offline."
            echo "::error::Attach natgw-tokenscope-prod to $RUNNER_SUBNET_NAME, then re-run."
            exit 1
          }

          echo "VNET_NAME=$VNET_NAME" >> "$GITHUB_ENV"
          echo "RUNNER_NSG_ID=$RUNNER_NSG" >> "$GITHUB_ENV"
          echo "RUNNER_NAT_ID=$RUNNER_NAT_ID" >> "$GITHUB_ENV"

          export RUNNER_PREFIX RUNNER_NSG RUNNER_NAT_ID

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROD_INFRA"])
          subnet_name = os.environ["RUNNER_SUBNET_NAME"]
          prefix = os.environ["RUNNER_PREFIX"]
          nsg_id = os.environ["RUNNER_NSG"]
          nat_id = os.environ["RUNNER_NAT_ID"]

          param_file = root / "parameters" / "prod.bicepparam"

          def set_param(name, value):
              text = param_file.read_text(encoding="utf-8")
              pattern = rf"(?m)^[ \t]*param[ \t]+{name}[ \t]*=[^\r\n]*"
              line = f"param {name} = '{value}'"
              found = re.findall(pattern, text)
              if len(found) > 1:
                  raise SystemExit(f"Duplicate {name} parameters found.")
              if found:
                  text = re.sub(pattern, line, text, count=1)
              else:
                  text = text.rstrip() + "\n\n" + line + "\n"
              param_file.write_text(text, encoding="utf-8")

          # ================================================
          # 1. Runner subnet CIDR -> buildSubnetPrefix
          # ================================================

          set_param("buildSubnetPrefix", prefix)
          print(f"buildSubnetPrefix = {prefix}")

          # ================================================
          # 2. NAT gateway -> natGatewayId
          #    main.bicep attaches it to the Container Apps
          #    and build (runner) subnets.
          # ================================================

          set_param("natGatewayId", nat_id)
          print("natGatewayId kept: " + nat_id.rsplit("/", 1)[-1])

          # ================================================
          # 3. networking.bicep: name build subnet
          #    snet-github-runner and attach its NSG only.
          # ================================================

          net_file = root / "modules" / "networking.bicep"
          lines = net_file.read_text(encoding="utf-8").splitlines(keepends=True)

          def indent_of(line):
              return len(line) - len(line.lstrip(" \t"))

          hits = [
              i for i, line in enumerate(lines)
              if "buildSubnetPrefix" in line
              and re.search(r"\b(addressPrefix|prefix)\b\s*:", line)
          ]

          if len(hits) != 1:
              raise SystemExit(
                  "ERROR: build subnet prefix line not found exactly once "
                  f"in networking.bicep (found {len(hits)})."
              )

          prefix_index = hits[0]

          # ---- subnet name --------------------------------
          name_index = None
          for i in range(prefix_index - 1, max(prefix_index - 20, -1), -1):
              if re.match(r"^\s*name\s*:", lines[i]):
                  name_index = i
                  break

          if name_index is None:
              raise SystemExit("ERROR: build subnet name line not found above its prefix.")

          old = lines[name_index]
          ending = "\r\n" if old.endswith("\r\n") else "\n"
          new = f"{old[:indent_of(old)]}name: '{subnet_name}'{ending}"

          if old.strip() != new.strip():
              lines[name_index] = new
              print("Build subnet renamed: " + old.strip() + " -> " + new.strip())
          else:
              print("Build subnet already named " + subnet_name + ".")

          # ---- NSG on build subnet only -------------------
          prop_line = lines[prefix_index]
          prop_pad = prop_line[:indent_of(prop_line)]
          prop_indent = indent_of(prop_line)

          end_index = prefix_index + 1
          while end_index < len(lines):
              line = lines[end_index]
              if line.strip() and indent_of(line) < prop_indent:
                  break
              end_index += 1

          nsg_block = [
              f"{prop_pad}networkSecurityGroup: {{{ending}",
              f"{prop_pad}  id: '{nsg_id}'{ending}",
              f"{prop_pad}}}{ending}",
          ]

          nsg_start = None
          for i in range(prefix_index + 1, end_index):
              if (indent_of(lines[i]) == prop_indent
                      and lines[i].lstrip().startswith("networkSecurityGroup")):
                  nsg_start = i
                  break

          if nsg_start is None:
              lines[prefix_index + 1:prefix_index + 1] = nsg_block
              print("Runner NSG added to build subnet.")
          else:
              depth = 0
              nsg_end = nsg_start
              while True:
                  depth += lines[nsg_end].count("{") - lines[nsg_end].count("}")
                  if depth <= 0:
                      break
                  nsg_end += 1
                  if nsg_end >= len(lines):
                      raise SystemExit("ERROR: unbalanced networkSecurityGroup block.")
              lines[nsg_start:nsg_end + 1] = nsg_block
              print("Existing build-subnet NSG expression replaced with runner NSG.")

          net_file.write_text("".join(lines), encoding="utf-8")

          print("Runner subnet, NSG and NAT gateway preserved in temporary template.")
          print("Original repository files unchanged.")
          PY

      # ============================================================
      # STEP 8: VALIDATE BICEP FILES (temporary copy)
      # ============================================================

      - name: Validate PROD Bicep
        shell: bash
        run: |
          set -euo pipefail

          az bicep build --file "$PROD_INFRA/main.bicep" --stdout > /dev/null
          az bicep build-params --file "$PROD_PARAM_FILE" --stdout > /dev/null

          echo "SUCCESS: PROD Bicep compilation completed"

      # ============================================================
      # STEP 9: VALIDATE ARM DEPLOYMENT
      # ============================================================

      - name: Validate PROD ARM Deployment
        shell: bash
        run: |
          set -euo pipefail

          az deployment group validate \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters "$PROD_PARAM_FILE" \
            --only-show-errors \
            --output none

          echo "SUCCESS: PROD ARM validation completed"

      # ============================================================
      # STEP 9B: GUARD AGAINST SUBNET / RESOURCE DELETION
      # ============================================================

      - name: Guard Against Subnet Deletion
        shell: bash
        run: |
          set -euo pipefail

          SAFE_REMOVALS=""

          for SUBNET in $ALLOWED_SUBNET_REMOVALS; do
            if ! SUBNET_JSON="$(az network vnet subnet show \
                -g "$AZURE_RESOURCE_GROUP" \
                --vnet-name "$VNET_NAME" \
                -n "$SUBNET" -o json 2>/dev/null)"; then
              echo "Allowed removal $SUBNET does not exist. Nothing to check."
              continue
            fi

            IN_USE="$(jq '
              ((.ipConfigurations // []) | length)
              + ((.privateEndpoints // []) | length)
              + ((.serviceAssociationLinks // []) | length)
              + ((.resourceNavigationLinks // []) | length)
              + ((.ipConfigurationProfiles // []) | length)
            ' <<< "$SUBNET_JSON")"

            PREFIX="$(jq -r '.addressPrefix // .addressPrefixes[0] // ""' <<< "$SUBNET_JSON")"

            if [ "$IN_USE" = "0" ]; then
              echo "Subnet $SUBNET ($PREFIX) is empty. Removal allowed."
              SAFE_REMOVALS="$SAFE_REMOVALS $SUBNET"
            else
              echo "::error::Subnet $SUBNET ($PREFIX) is still in use ($IN_USE attachments). Not removing it."
            fi
          done

          export SAFE_REMOVALS

          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters "$PROD_PARAM_FILE" \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            --only-show-errors > whatif.json

          python3 - <<'PY'
          import json
          import os

          safe = set(os.environ.get("SAFE_REMOVALS", "").split())

          with open("whatif.json", encoding="utf-8") as f:
              data = json.load(f)

          problems = []
          allowed = []

          for change in data.get("changes", []):
              rid = change.get("resourceId", "")
              kind = change.get("changeType", "")

              if kind == "Delete":
                  name = rid.rsplit("/", 1)[-1]
                  if "/subnets/" in rid and name in safe:
                      allowed.append(name)
                  else:
                      problems.append(f"Delete: {rid}")

              if "/virtualNetworks/" in rid and "/subnets/" not in rid:
                  before = (change.get("before") or {}).get("properties", {})
                  after = (change.get("after") or {}).get("properties", {})

                  old = {s.get("name") for s in before.get("subnets", [])}
                  new = {s.get("name") for s in after.get("subnets", [])}

                  for name in sorted(old - new):
                      if name in safe:
                          allowed.append(name)
                      else:
                          problems.append(f"Subnet would be removed: {name}")

          for name in sorted(set(allowed)):
              print(f"::notice::Empty subnet {name} will be removed (approved).")

          if problems:
              for p in problems:
                  print("::error::" + p)
              raise SystemExit("Deployment stopped: unapproved deletions detected.")

          print("SUCCESS: No unapproved subnet removals or resource deletions.")
          PY

      # ============================================================
      # STEP 10: DEPLOY PROD INFRASTRUCTURE
      #
      # Starts the deployment with --no-wait and polls, so a short
      # network blip on the runner cannot leave the job hanging.
      # ============================================================

      - name: Deploy PROD Infrastructure
        shell: bash
        run: |
          set -euo pipefail

          DEPLOYMENT_NAME="tokenscope-prod-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "DEPLOYMENT_NAME=$DEPLOYMENT_NAME" >> "$GITHUB_ENV"

          echo "Deploying TokenScope PROD infrastructure: $DEPLOYMENT_NAME"

          az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters "$PROD_PARAM_FILE" \
            --mode Incremental \
            --no-wait \
            --only-show-errors

          for i in $(seq 1 180); do
            STATE="$(az deployment group show \
              -g "$AZURE_RESOURCE_GROUP" \
              -n "$DEPLOYMENT_NAME" \
              --query properties.provisioningState \
              -o tsv 2>/dev/null || echo "Unknown")"

            echo "[$i] Deployment state: $STATE"

            case "$STATE" in
              Succeeded)
                echo "SUCCESS: PROD infrastructure deployment completed"
                exit 0
                ;;
              Failed|Canceled)
                az deployment operation group list \
                  -g "$AZURE_RESOURCE_GROUP" \
                  -n "$DEPLOYMENT_NAME" \
                  --query "[?properties.provisioningState=='Failed'].{resource:properties.targetResource.resourceName, error:properties.statusMessage.error.message}" \
                  -o table || true
                echo "::error::Deployment $STATE"
                exit 1
                ;;
            esac

            sleep 20
          done

          echo "::error::Deployment did not finish within 60 minutes."
          exit 1

      # ============================================================
      # STEP 10B: VERIFY RUNNER SUBNET, NSG AND NAT AFTER DEPLOYMENT
      # ============================================================

      - name: Verify Runner Subnet, NSG and NAT Gateway
        if: always() && env.VNET_NAME != ''
        shell: bash
        run: |
          set -euo pipefail

          SUBNET_JSON="$(az network vnet subnet show \
            -g "$AZURE_RESOURCE_GROUP" \
            --vnet-name "$VNET_NAME" \
            -n "$RUNNER_SUBNET_NAME" \
            -o json)"

          ACTUAL_NSG="$(jq -r '.networkSecurityGroup.id // empty' <<< "$SUBNET_JSON")"
          ACTUAL_NAT="$(jq -r '.natGateway.id // empty' <<< "$SUBNET_JSON")"

          if [ "${ACTUAL_NSG,,}" != "${RUNNER_NSG_ID,,}" ]; then
            echo "::warning::Runner NSG missing after deployment. Re-attaching."
            az network vnet subnet update \
              -g "$AZURE_RESOURCE_GROUP" \
              --vnet-name "$VNET_NAME" \
              -n "$RUNNER_SUBNET_NAME" \
              --network-security-group "$RUNNER_NSG_ID" \
              --output none
          fi

          if [ "${ACTUAL_NAT,,}" != "${RUNNER_NAT_ID,,}" ]; then
            echo "::warning::NAT gateway missing after deployment. Re-attaching."
            az network vnet subnet update \
              -g "$AZURE_RESOURCE_GROUP" \
              --vnet-name "$VNET_NAME" \
              -n "$RUNNER_SUBNET_NAME" \
              --nat-gateway "$RUNNER_NAT_ID" \
              --output none
          fi

          echo "SUCCESS: $RUNNER_SUBNET_NAME has NSG ${RUNNER_NSG_ID##*/} and NAT ${RUNNER_NAT_ID##*/}"

      # ============================================================
      # STEP 11: SHOW DEPLOYMENT OUTPUTS
      # ============================================================

      - name: Show PROD Deployment Outputs
        shell: bash
        run: |
          set -euo pipefail

          az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$DEPLOYMENT_NAME" \
            --query properties.outputs \
            --output json > deployment-outputs.json

          python3 - <<'PY'
          import json

          with open("deployment-outputs.json", encoding="utf-8") as f:
              outputs = json.load(f) or {}

          for key in (
              "acrLoginServer",
              "containerAppName",
              "containerAppUrl",
              "keyVaultName",
              "postgresqlServerName",
              "frontDoorEndpointFqdn",
              "frontDoorInstanceId",
              "frontDoorPrivateLinkRequestMessage"
          ):
              value = outputs.get(key, {}).get("value", "")
              if value:
                  print(f"{key}: {value}")
          PY

          az containerapp show \
            -g "$AZURE_RESOURCE_GROUP" \
            -n ca-ts-prod-weu \
            --query "{state:properties.provisioningState, revision:properties.latestReadyRevisionName}" \
            -o table || true

      # ============================================================
      # STEP 12: SUMMARY
      # ============================================================

      - name: PROD Deployment Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## TokenScope PROD Infrastructure"
            echo ""
            echo "- Resource group: $AZURE_RESOURCE_GROUP"
            echo "- Subscription: $EXPECTED_SUBSCRIPTION"
            echo "- Region: $AZURE_LOCATION"
            echo "- Deployment: ${DEPLOYMENT_NAME:-not started}"
            echo "- Front Door phase: $FRONT_DOOR_PHASE"
            echo "- Runner subnet: $RUNNER_SUBNET_NAME (NSG $RUNNER_SUBNET_EXPECTED_NSG, NAT kept)"
            echo ""
            echo "- PostgreSQL geo backup disabled: $PROD_DISABLE_GEO_REDUNDANT_BACKUP"
            echo "- PostgreSQL HA disabled (temporary exception): $PROD_DISABLE_POSTGRES_HA"
            echo "- Monitoring alerts enabled: $DEPLOY_MONITORING_ALERTS"
            echo "- Application alerts enabled: $DEPLOY_APP_ALERTS"
            echo ""
            echo "Shared repository Bicep files remain unchanged."
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # STEP 13: LOGOUT
      # ============================================================

      - name: Azure Logout
        if: always()
        shell: bash
        run: |
          az logout || true
