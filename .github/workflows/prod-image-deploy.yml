name: Build and Deploy TokenScope PROD Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable PROD tag. Leave empty to use the first 12 characters of the commit SHA."
        type: string
        default: ""
        required: false
      confirm_production:
        description: "Type DEPLOY-PROD-IMAGE"
        type: string
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: tokenscope-prod-image
  cancel-in-progress: false

jobs:
  build-push-rollout:
    name: Build, push and roll out PROD

    # PROD ACR is private. Register a Linux x64 self-hosted runner in the
    # PROD build subnet with the custom label "tokenscope-prod".
    runs-on: [self-hosted, Linux, X64, tokenscope-prod]
    environment: prod
    timeout-minutes: 60

    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
      HEALTH_URL: ${{ vars.TOKENSCOPE_HEALTH_URL }}
      IMAGE_NAME: tokenscope
      REQUESTED_TAG: ${{ inputs.image_tag }}
      CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}

    steps:
      - name: Checkout approved revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Azure login with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate production target and private runner
        shell: bash
        run: |
          set -euo pipefail

          [ "$CONFIRM_PRODUCTION" = "DEPLOY-PROD-IMAGE" ] || {
            echo "::error::confirm_production must be DEPLOY-PROD-IMAGE"
            exit 1
          }

          for name in AZURE_RESOURCE_GROUP EXPECTED_SUBSCRIPTION_ID ACR_NAME CONTAINER_APP_NAME; do
            [ -n "$(printenv "$name")" ] || {
              echo "::error::$name is not configured in the prod Environment"
              exit 1
            }
          done

          [ -f Dockerfile ] || {
            echo "::error::The root TokenScope Dockerfile was not found"
            exit 1
          }

          actual_subscription="$(az account show --query id -o tsv)"
          [ "$actual_subscription" = "$EXPECTED_SUBSCRIPTION_ID" ] || {
            echo "::error::Logged into $actual_subscription; expected $EXPECTED_SUBSCRIPTION_ID"
            exit 1
          }

          az extension add --name containerapp --upgrade --yes >/dev/null
          az acr show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$ACR_NAME" \
            --output none
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" \
            --output none

          # Private ACR DNS must resolve from this runner.
          getent hosts "${ACR_NAME}.azurecr.io"
          docker info >/dev/null

      - name: Resolve immutable image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail

          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            tag="$(git rev-parse --short=12 HEAD)"
          fi

          [[ "$tag" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "::error::Invalid image tag: $tag"
            exit 1
          }

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "repository=${ACR_NAME}.azurecr.io/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Building commit $GITHUB_SHA as tag $tag"

      - name: Login to private PROD ACR and protect immutable tag
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"

          if az acr repository show \
              --name "$ACR_NAME" \
              --image "${IMAGE_NAME}:${IMAGE_TAG}" \
              --output none 2>/dev/null; then
            echo "::error::${IMAGE_NAME}:${IMAGE_TAG} already exists. Use a new immutable tag."
            exit 1
          fi

      - name: Build TokenScope production image
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          docker build \
            --file Dockerfile \
            --build-arg GIT_COMMIT_SHA="$GITHUB_SHA" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${IMAGE_REPOSITORY}:${IMAGE_TAG}" \
            .

      - name: Push immutable image
        id: push
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
        run: |
          set -euo pipefail
          docker push "${IMAGE_REPOSITORY}:${IMAGE_TAG}"

          digest="$(az acr repository show \
            --name "$ACR_NAME" \
            --image "${IMAGE_NAME}:${IMAGE_TAG}" \
            --query digest \
            --output tsv)"

          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::ACR returned an invalid digest: $digest"
            exit 1
          }

          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE_REPOSITORY}:${IMAGE_TAG} as $digest"

      - name: Record current Container App image
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          previous_image="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" \
            --query 'properties.template.containers[0].image' \
            --output tsv 2>/dev/null || true)"
          echo "image=$previous_image" >> "$GITHUB_OUTPUT"
          echo "Previous image: ${previous_image:-none}"

      - name: Roll out immutable image digest
        id: rollout
        shell: bash
        env:
          PROD_IMAGE: ${{ steps.push.outputs.image }}
        run: |
          set -euo pipefail
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" \
            --image "$PROD_IMAGE" \
            --output none

      - name: Verify new revision
        id: verify
        shell: bash
        env:
          PROD_IMAGE: ${{ steps.push.outputs.image }}
        run: |
          set -euo pipefail
          healthy_revision=""

          for attempt in $(seq 1 30); do
            latest="$(az containerapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$CONTAINER_APP_NAME" \
              --query properties.latestRevisionName -o tsv)"

            latest_ready="$(az containerapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$CONTAINER_APP_NAME" \
              --query properties.latestReadyRevisionName -o tsv)"

            revision_image="$(az containerapp revision show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$CONTAINER_APP_NAME" \
              --revision "$latest" \
              --query 'properties.template.containers[0].image' \
              --output tsv 2>/dev/null || true)"

            health="$(az containerapp revision show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$CONTAINER_APP_NAME" \
              --revision "$latest" \
              --query properties.healthState \
              --output tsv 2>/dev/null || true)"

            echo "Attempt $attempt: latest=$latest ready=$latest_ready health=${health:-unknown} image=${revision_image:-unknown}"

            if [ "$latest" = "$latest_ready" ] && \
               [ "$health" = "Healthy" ] && \
               [ "$revision_image" = "$PROD_IMAGE" ]; then
              healthy_revision="$latest"
              break
            fi

            sleep 20
          done

          [ -n "$healthy_revision" ] || {
            echo "::error::The new PROD revision did not become Ready and Healthy"
            exit 1
          }

          echo "revision=$healthy_revision" >> "$GITHUB_OUTPUT"

          if [ -n "$HEALTH_URL" ]; then
            base_url="${HEALTH_URL%/}"
            status=""
            for attempt in $(seq 1 12); do
              status="$(curl -sS -o health-response.json -w '%{http_code}' \
                --max-time 15 "$base_url/api/health" || true)"
              if [ "$status" = "200" ]; then
                break
              fi
              echo "Attempt $attempt: $base_url/api/health returned ${status:-000}"
              sleep 15
            done

            [ "$status" = "200" ] || {
              echo "::error::$base_url/api/health did not return HTTP 200"
              exit 1
            }
          else
            echo "::notice::TOKENSCOPE_HEALTH_URL is empty; Azure revision health was verified only"
          fi

      - name: Move latest tag after successful verification
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
        run: |
          set -euo pipefail
          docker tag "${IMAGE_REPOSITORY}:${IMAGE_TAG}" "${IMAGE_REPOSITORY}:latest"
          docker push "${IMAGE_REPOSITORY}:latest"

      - name: Roll back if rollout or verification fails
        if: failure() && (steps.rollout.outcome == 'failure' || steps.verify.outcome == 'failure') && steps.previous.outputs.image != ''
        shell: bash
        env:
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
        run: |
          set -euo pipefail
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" \
            --image "$PREVIOUS_IMAGE" \
            --output none
          echo "::warning::Rolled back to $PREVIOUS_IMAGE"

      - name: Deployment summary
        if: success()
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          PROD_IMAGE: ${{ steps.push.outputs.image }}
          REVISION: ${{ steps.verify.outputs.revision }}
        run: |
          {
            echo "## TokenScope PROD image deployment"
            echo "- Commit: $GITHUB_SHA"
            echo "- Immutable tag: $IMAGE_TAG"
            echo "- Digest: $IMAGE_DIGEST"
            echo "- Deployed image: $PROD_IMAGE"
            echo "- Healthy revision: $REVISION"
            echo "- Next: set the prod Environment variable IMAGE_TAG to $IMAGE_TAG before rerunning the infrastructure workflow."
          } >> "$GITHUB_STEP_SUMMARY"
