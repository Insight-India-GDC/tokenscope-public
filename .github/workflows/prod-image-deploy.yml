
      - name: Test PROD ACR private connectivity
        shell: bash
        run: |
          set -euo pipefail

          echo "Runner: $RUNNER_NAME"

          echo "Checking registry DNS..."
          getent ahostsv4 \
            crtokenscopeigdcprodproductionweu.azurecr.io || true

          echo "Checking data endpoint DNS..."
          getent ahostsv4 \
            crtokenscopeigdcprodproductionweu.westeurope.data.azurecr.io || true

          echo "Testing login endpoint..."
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            --connect-timeout 10 \
            --max-time 15 \
            https://crtokenscopeigdcprodproductionweu.azurecr.io/v2/ || true
