name: Test Azure DEV OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  azure-login-test:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure access
        env:
          DEV_RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          echo "=== Subscription ==="
          az account show --query "{Name:name,State:state,Subscription:id}" -o table

          echo ""
          echo "=== Resource Group ==="
          az group show \
            --name "$DEV_RG" \
            --query "{Name:name,Location:location}" \
            -o table

      - name: Check Service Principal Role Assignments
        run: |
          echo "=== Current Role Assignments ==="
          az role assignment list \
            --assignee ${{ vars.AZURE_CLIENT_ID }} \
            --all \
            -o table || true

      - name: Check Required Resource Providers
        run: |
          echo "=== Provider Status ==="

          for p in \
            Microsoft.Storage \
            Microsoft.ContainerRegistry \
            Microsoft.App \
            Microsoft.KeyVault \
            Microsoft.DBforPostgreSQL \
            Microsoft.Cache \
            Microsoft.ManagedIdentity \
            Microsoft.OperationalInsights \
            Microsoft.Insights \
