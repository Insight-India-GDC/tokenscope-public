
name: Test Azure DEV OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  azure-login-test:
    runs-on: ubuntu-latest
    environment: AZURE_SUBSCRIPTION_ID

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure access
        env:
          DEV_RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          echo "Checking Azure subscription..."
          az account show --query "{Name:name,State:state}" -o table

          echo "Checking DEV resource group..."
          az group show --name "$DEV_RG" \
            --query "{Name:name,Location:location}" -o table

          echo "Azure DEV authentication successful!"
