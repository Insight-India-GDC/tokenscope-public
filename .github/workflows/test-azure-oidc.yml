
name: Test Azure DEV OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-azure-login:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure subscription
        run: |
          az account show --query "{Name:name,State:state}" -o table

      - name: Verify DEV resource group
        env:
          DEV_RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          az group show --name "$DEV_RG" -o table

      - name: Confirm success
        run: echo "GitHub Actions successfully connected to Azure DEV!"
